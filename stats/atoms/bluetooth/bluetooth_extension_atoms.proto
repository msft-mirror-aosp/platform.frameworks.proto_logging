/**
 * Logs BluetoothEnergyMonitorReported when the energy monitor BQR is received.
 *
 * Logged from:
 *     packages/modules/Bluetooth
 *
 * Estimated Logging Rate:
 *     Peak: 100 time in 1 day | Avg: 50 per device per day
 *     Once per energy monitor BQR.
 */
message BluetoothEnergyMonitorReported {
  // BQR version
  // Original type: uint16_t
  // Default: 0x0000
  // BqrVersion5_0: 0x103
  // BqrVersion6_0: 0x104
  // BqrVersion7_0: 0x105
  optional int32 bqr_version = 1;
  // Quality report ID
  // Original type: uint8_t
  // Default: BQR_ID_UNKNOWN
  optional android.bluetooth.hci.BqrIdEnum quality_report_id = 2;
  // Average current consumption of all activities consumed by the controller
  // (mA) Original type: uint16_t
  optional int32 avg_current_consume = 3;
  // Total time in the idle (low power states, sleep) state. (ms)
  // Original type: uint32_t
  optional int64 idle_total_time = 4;
  // Indicates how many times the controller enters the idle state.
  // Original type: uint32_t
  optional int64 idle_state_enter_count = 5;
  // Total time in the active (inquiring, paging, ACL/SCO/eSCO/BIS/CIS traffic,
  // processing any task) state. (ms) Original type: uint32_t
  optional int64 active_total_time = 6;
  // Indicates how many times the controller enters the active states.
  // Original type: uint32_t
  optional int64 active_state_enter_count = 7;
  // Total time in the BR/EDR specific Tx(Transmitting for ACL/SCO/eSCO
  // traffic)state (ms) Original type: uint32_t
  optional int64 bredr_tx_total_time = 8;
  // Indicates how many times the controller enters the BR/EDR specific Tx
  // state. Original type: uint32_t
  optional int64 bredr_tx_state_enter_count = 9;
  // Average Tx power level of all the BR/EDR link(s) (dBm)
  // Original type: uint8_t
  optional int32 bredr_tx_avg_power_lv = 10;
  // Total time in the BR/EDR specific Rx (Receiving from ACL/SCO/eSCO traffic)
  // state. (ms) Original type: uint32_t
  optional int64 bredr_rx_total_time = 11;
  // Indicates how many times the controller enters the BR/EDR specific Rx
  // state. (ms) Original type: uint32_t
  optional int64 bredr_rx_state_enter_count = 12;
  // Total time in the LE specific Tx (Transmitting for either ACL/BIS/CIS or LE
  // advertising traffic) state (ms) Original type: uint32_t
  optional int64 le_tx_total_time = 13;
  // Indicates how many times the controller enters theLE specific Tx state.
  // Original type: uint32_t
  optional int64 le_tx_state_enter_count = 14;
  // Average Tx power level of all the LE link(s) (dBm)
  // Original type: uint8_t
  optional int32 le_tx_avg_power_lv = 15;
  // Total time in the LE specific Rx (Receiving from either ACL/BIS/CIS or LE
  // scanning traffic) state. (ms) Original type: uint32_t
  optional int64 le_rx_total_time = 16;
  // Indicates how many times the controller enters the LE specific Rx state
  // Original type: uint32_t
  optional int64 le_rx_state_enter_count = 17;
  // The total time duration to collect power related information (ms)
  // Original type: uint32_t
  optional int64 tm_period = 18;
  // The time duration of RX active in one chain
  // Original type: uint32_t
  optional int64 rx_active_one_chain_time = 19;
  // The time duration of RX active in two chain
  // Original type: uint32_t
  optional int64 rx_active_two_chain_time = 20;
  // The time duration of internal TX active in one chain
  // Original type: uint32_t
  optional int64 tx_ipa_active_one_chain_time = 21;
  // The time duration of internal TX active in two chain
  // Original type: uint32_t
  optional int64 tx_ipa_active_two_chain_time = 22;
  // The time duration of external TX active in one chain
  // Original type: uint32_t
  optional int64 tx_epa_active_one_chain_time = 23;
  // The time duration of external TX active in two chain
  // Original type: uint32_t
  optional int64 tx_epa_active_two_chain_time = 24;
}

