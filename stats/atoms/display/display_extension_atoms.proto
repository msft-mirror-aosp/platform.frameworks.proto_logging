syntax = "proto2";

package android.os.statsd.display;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/enums/display/display_enums.proto";

option java_package = "com.android.os.display";
option java_multiple_files = true;

extend Atom {
  optional DisplayModeDirectorVoteChanged display_mode_director_vote_changed = 792 [(module) = "framework"];
  optional DisplayEventCallbackOccurred display_event_callback_occurred = 1149 [(module) = "framework"];
  optional DisplayOffloadStateChanged display_offload_state_changed = 1161 [(module) = "framework"];
  optional DisplayOffloadTransitionReported display_offload_transition_reported = 1162 [(module) = "framework"];
  optional DisplayOffloadCycleStats display_offload_cycle_stats = 1163 [(module) = "framework"];
  optional DisplayOffloadSessionStats display_offload_session_stats = 1164 [(module) = "framework"];
}

/* Pushed atom for vote status change */
message DisplayModeDirectorVoteChanged {
  // Display id, or -1 if global vote
  optional int32 display_id = 1;
  // Vote priority numeric value, see com.android.server.display.mode.Vote
  optional int32 vote_priority = 2;
  // Vote status
  optional android.display.DisplayModeDirectorVoteStatus vote_status = 3;
  // Vote value, max refresh rate for now
  optional int32 value = 4;
  // Base mode value, -1 if not active
  optional int32 summary_value = 5;
}

/* Pushed atom for display event callback */
message DisplayEventCallbackOccurred {
  // The type of display event that occurred.
  optional android.display.EventType event_type = 1;
  // The UID of the client that received this callback.
  repeated int32 uid = 2 [(is_uid) = true];
}

/**
 * Logs top-level display offload state changes (offloaded, deoffloaded).
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadStateChanged {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for offload sessions that were present in the cycle.
  // Sessions can persist across multiple cycles.
  // All lists must be sorted by (UID, session type, renderer type) tuples.
  repeated int32 session_ids = 2;
  repeated int32 uids = 3 [(is_uid) = true];
  repeated android.display.DisplayOffloadSessionType session_types = 4;
  repeated android.display.DisplayOffloadRendererType renderer_types = 5;

  optional android.display.DisplayOffloadState offload_state = 6;
}

/**
 * Logs cycle-level and session-level transitions.
 * Cycle-level transitions are logged after all cycle's sessions finish their transitions.
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadTransitionReported {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for offload sessions that were present in the cycle.
  // Sessions can persist across multiple cycles.
  // All lists must be sorted by (UID, session type, renderer type) tuples.
  // Session-level transitions will contain a single element in the lists.
  repeated int32 session_ids = 2;
  repeated int32 uids = 3 [(is_uid) = true];
  repeated android.display.DisplayOffloadSessionType session_types = 4;
  repeated android.display.DisplayOffloadRendererType renderer_types = 5;

  optional android.display.DisplayOffloadAggregationLevel aggregation_level = 6;

  optional android.display.DisplayOffloadTransitionType transition_type = 7;
  optional android.display.DisplayOffloadTransitionResult transition_result = 8;
  optional int32 transition_time_ms = 9;
}

/**
 * Logs offload cycle stats when offload cycle ends (one atom per cycle).
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadCycleStats {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for offload sessions that were present in the cycle.
  // Sessions can persist across multiple cycles.
  // All lists must be sorted by (UID, session type, renderer type) tuples.
  repeated int32 session_ids = 2;
  repeated int32 uids = 3 [(is_uid) = true];
  repeated android.display.DisplayOffloadSessionType session_types = 4;
  repeated android.display.DisplayOffloadRendererType renderer_types = 5;

  optional int32 offload_cycle_duration_ms = 6;

  repeated int32 gpu_draw_time_per_frame_ms = 7
    [(histogram_bin_option).generated_bins = {
      min: 0
      max: 25
      count: 25
      strategy: LINEAR
    }];

  // Number of frames drawn in AOD at a given frames-per-minute frame rate.
  repeated int32 always_on_display_frame_count_per_fpm = 8
    [(histogram_bin_option).explicit_bins = {
      bin: 1     // 1/60 FPS
      bin: 3     // 1/20 FPS
      bin: 12    // 1/5 FPS
      bin: 60    // 1 FPS
      bin: 300   // 5 FPS
      bin: 600   // 10 FPS
      bin: 900   // 15 FPS
      bin: 1200  // 20 FPS
      bin: 1500  // 25 FPS
      bin: 1800  // 30 FPS
      bin: 2100  // 35 FPS
      bin: 2400  // 40 FPS
      bin: 2700  // 45 FPS
      bin: 3000  // 50 FPS
      bin: 3300  // 55 FPS
      bin: 3600  // 60 FPS
    }];

  // Number of frames drawn in false-interactive mode at a given frames-per-minute frame rate.
  repeated int32 false_interactive_frame_count_per_fpm = 9
    [(histogram_bin_option).explicit_bins = {
      bin: 1     // 1/60 FPS
      bin: 3     // 1/20 FPS
      bin: 12    // 1/5 FPS
      bin: 60    // 1 FPS
      bin: 300   // 5 FPS
      bin: 600   // 10 FPS
      bin: 900   // 15 FPS
      bin: 1200  // 20 FPS
      bin: 1500  // 25 FPS
      bin: 1800  // 30 FPS
      bin: 2100  // 35 FPS
      bin: 2400  // 40 FPS
      bin: 2700  // 45 FPS
      bin: 3000  // 50 FPS
      bin: 3300  // 55 FPS
      bin: 3600  // 60 FPS
    }];

  // Time to move framebuffer to display hardware, per frame
  optional int32 min_framebuffer_to_display_hw_transfer_time_per_frame_ms = 10;
  optional int32 avg_framebuffer_to_display_hw_transfer_time_per_frame_ms = 11;
  optional int32 max_framebuffer_to_display_hw_transfer_time_per_frame_ms = 12;

  // GPU command queue flush count, GPU driver-driven, per frame
  optional int32 avg_driver_driven_gpu_command_queue_flush_count_per_frame = 13;
  optional int32 max_driver_driven_gpu_command_queue_flush_count_per_frame = 14;

  // GPU command queue flush count, client forced, per frame
  optional int32 avg_client_forced_gpu_command_queue_flush_count_per_frame = 15;
  optional int32 max_client_forced_gpu_command_queue_flush_count_per_frame = 16;

  optional int32 total_frame_count = 17;
  optional int32 janky_frame_count = 18;

  // Number of tilt-to-wakes and the time device spent in false-interactive mode after TTW
  optional int32 tilt_to_wake_event_count = 19;
  optional int32 tilt_to_wake_false_interactive_duration_ms = 20;
}

/**
 * Logs offload session stats when offload cycle ends (one atom per session that
 * took part in the cycle).
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadSessionStats {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for an offload session that was present in the cycle.
  // Sessions can persist across multiple cycles.
  optional int32 session_id = 2;
  optional int32 uid = 3 [(is_uid) = true];
  optional android.display.DisplayOffloadSessionType session_type = 4;
  optional android.display.DisplayOffloadRendererType renderer_type = 5;

  // Fast memory usage
  optional int32 fast_memory_max_bytes = 6;
  optional int32 fast_memory_offload_cycle_end_bytes = 7;
  optional int32 fast_memory_max_available_memory_block_bytes = 8;

  // Regular memory usage
  optional int32 regular_memory_max_bytes = 9;
  optional int32 regular_memory_offload_cycle_end_bytes = 10;
  optional int32 regular_memory_max_available_memory_block_bytes = 11;

  // External memory usage
  optional int32 external_memory_max_bytes = 12;
  optional int32 external_memory_offload_cycle_end_bytes = 13;
  optional int32 external_memory_max_available_memory_block_bytes = 14;

  // Glyph memory usage
  optional int32 glyph_memory_max_bytes = 15;
  optional int32 glyph_memory_offload_cycle_end_bytes = 16;
  optional int32 glyph_memory_max_available_memory_block_bytes = 17;

  optional int32 layout_size_bytes = 18;

  repeated int32 expression_evaluation_time_per_frame_ms = 19
    [(histogram_bin_option).generated_bins = {
      min: 0
      max: 25
      count: 25
      strategy: LINEAR
    }];

  repeated int32 renderer_draw_time_per_frame_ms = 20
    [(histogram_bin_option).generated_bins = {
      min: 0
      max: 25
      count: 25
      strategy: LINEAR
    }];
}
