syntax = "proto2";

package android.os.statsd.display;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/enums/display/display_enums.proto";

option java_package = "com.android.os.display";
option java_multiple_files = true;

extend Atom {
  optional DisplayModeDirectorVoteChanged display_mode_director_vote_changed = 792 [(module) = "framework"];
  optional DisplayEventCallbackOccurred display_event_callback_occurred = 1149 [(module) = "framework"];
  optional DisplayOffloadStateChanged display_offload_state_changed = 1161 [(module) = "framework"];
  optional DisplayOffloadTransitionReported display_offload_transition_reported = 1162 [(module) = "framework"];
  optional DisplayOffloadCycleStats display_offload_cycle_stats = 1163 [(module) = "framework"];
  optional DisplayOffloadSessionStats display_offload_session_stats = 1164 [(module) = "framework"];
  optional DisplayInfoChanged display_info_changed = 1174 [(module) = "framework"];
}

/* Pushed atom for vote status change */
message DisplayModeDirectorVoteChanged {
  // Display id, or -1 if global vote
  optional int32 display_id = 1;
  // Vote priority numeric value, see com.android.server.display.mode.Vote
  optional int32 vote_priority = 2;
  // Vote status
  optional android.display.DisplayModeDirectorVoteStatus vote_status = 3;
  // Vote value, max refresh rate for now
  optional int32 value = 4;
  // Base mode value, -1 if not active
  optional int32 summary_value = 5;
}

/* Pushed atom for display event callback */
message DisplayEventCallbackOccurred {
  // The type of display event that occurred.
  optional android.display.EventType event_type = 1;
  // The UIDs of the clients that received this callback.
  repeated int32 uid = 2 [(is_uid) = true];
  // Number of clients that received this callback.
  optional int32 client_count = 3;
}

/**
 * Logs top-level display offload state changes (offloaded, deoffloaded).
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadStateChanged {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for offload sessions that were present in the cycle.
  // Sessions can persist across multiple cycles.
  // All lists must be sorted by (UID, session type, renderer type) tuples.
  repeated int32 session_ids = 2;
  repeated int32 uids = 3 [(is_uid) = true];
  repeated android.display.DisplayOffloadSessionType session_types = 4;
  repeated android.display.DisplayOffloadRendererType renderer_types = 5;

  optional android.display.DisplayOffloadState offload_state = 6;
}

/**
 * Logs cycle-level and session-level transitions.
 * Cycle-level transitions are logged after all cycle's sessions finish their transitions.
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
message DisplayOffloadTransitionReported {
  // Identifies an offload cycle. A cycle begins when the display switches to an
  // offloaded state and ends when it switches back to a de-offloaded state.
  optional int32 cycle_id = 1;

  // Dimensions for offload sessions that were present in the cycle.
  // Sessions can persist across multiple cycles.
  // All lists must be sorted by (UID, session type, renderer type) tuples.
  // Session-level transitions will contain a single element in the lists.
  repeated int32 session_ids = 2;
  repeated int32 uids = 3 [(is_uid) = true];
  repeated android.display.DisplayOffloadSessionType session_types = 4;
  repeated android.display.DisplayOffloadRendererType renderer_types = 5;

  optional android.display.DisplayOffloadAggregationLevel aggregation_level = 6;

  optional android.display.DisplayOffloadTransitionType transition_type = 7;
  optional android.display.DisplayOffloadTransitionResult transition_result = 8;
  optional int32 transition_time_ms = 9;
}

/**
 * Logs offload cycle stats when offload cycle ends (one atom per cycle).
 *
 * Logged from:
 *  frameworks/opt/wear/src/com/android/clockwork/displayoffload/DisplayOffloadService.java
 */
