syntax = "proto2";

package android.os.statsd.framework;

import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/enums/framework/trust_token_enums.proto";

option java_package = "com.android.os.framework";
option java_outer_classname = "TrustTokenExtensionAtomsProto";
option java_multiple_files = true;

extend Atom {
  optional AcquireTrustTokenCalled acquire_trust_token_called = 1282
      [(module) = "framework"];
  optional VerifyTrustTokenCalled verify_trust_token_called = 1283
      [(module) = "framework"];
  optional RefreshTrustTokenStarted refresh_trust_token_started = 1284
      [(module) = "framework"];
  optional RefreshTrustTokenFinished refresh_trust_token_finished = 1285
      [(module) = "framework"];
  optional TrustTokenState trust_token_state = 10263 [(module) = "framework"];
}

/**
 * Logs when acquiring tokens from TrustTokenManager.
 * Logged from
 * frameworks/base/core/java/android/security/talisman/TrustTokenManager.java
 *
 * Estimated Logging Rate:
 * Peak: 1 times in 1 sec | Avg: 100 per device per day
 */
message AcquireTrustTokenCalled {
  optional TrustTokenType token_type = 1;
  enum Outcome {
    OUTCOME_UNKNOWN = 0;
    OUTCOME_SUCCESS = 1;
    // The trust anchor is not available, and the service cannot verify if the
    // token to return is valid.
    OUTCOME_ANCHOR_UNAVAILABLE = 2;
    // The service has no token left.
    OUTCOME_TOKEN_EXHAUSTED = 3;
    // The token to issue is invalid. This indicates that the service is in a
    // corrupt state.
    OUTCOME_TOKEN_INVALID = 4;
  }
  optional Outcome outcome = 2;
}

/**
 * Logs when verifying tokens with TrustTokenManager.
 * Logged from
 * frameworks/base/core/java/android/security/talisman/TrustTokenManager.java
 *
 * Estimated Logging Rate:
 * Peak: 1 times in 1 sec | Avg: 100 per device per day
 */
message VerifyTrustTokenCalled {
  // This largely aligns with android.security.talisman.VerificationResult. Note
  // the values may be different.
  enum Outcome {
    OUTCOME_UNKNOWN = 0;
    OUTCOME_SUCCESS = 1;
    OUTCOME_ANCHOR_UNAVAILABLE = 2;
    OUTCOME_SIGNATURE_INVALID = 3;
    OUTCOME_CHALLENGE_INCORRECT = 4;
    OUTCOME_INVALID_POLICY = 5;
    OUTCOME_FAILURE_UNKNOWN = 6;
  }
  optional Outcome outcome = 1;
  // This aligns with com.google.android.security.trusttoken.TrustTokenPolicy.
  // This is only set if the outcome is success.
  enum Policy {
    POLICY_UNKNOWN = 0;
    POLICY_VERIFIED_IDENTITY = 1;
    POLICY_VERIFIED_IDENTITY_STRONG = 2;
    POLICY_VERIFIED_DEVICE = 3;
    POLICY_VERIFIED_DEVICE_STRONG = 4;
  }
  optional Policy policy = 2;
}

/**
 * Logs when refreshing trust tokens starts.
 * Logged from
 * frameworks/base/services/core/java/com/android/server/security/talisman/TrustTokenManagerService.java
 *
 * Estimated Logging Rate:
 * Peak: 1 times in 72 hours | Avg: <1 per device per day
 */
message RefreshTrustTokenStarted {
  optional TrustTokenRefreshType refresh_type = 1;
}

/**
 * Logs when refreshing trust tokens finishes.
 * Logged from
 * frameworks/base/services/core/java/com/android/server/security/talisman/TrustTokenManagerService.java
 *
 * Estimated Logging Rate:
 * Peak: 1 times in 72 hours | Avg: <1 per device per day
 */
message RefreshTrustTokenFinished {
  optional TrustTokenRefreshType refresh_type = 1;
  enum Outcome {
    OUTCOME_UNKNOWN = 0;
    OUTCOME_SUCCESS = 1;
    // There's no TrustTokenService on the device.
    OUTCOME_PROVIDER_UNAVAILABLE = 2;
    // An error occurred when calling TrustTokenService.
    OUTCOME_SERVICE_ERROR = 3;
    // An error occurred when TrustTokenService calls the server.
    OUTCOME_SERVER_ERROR = 4;
  }
  optional Outcome outcome = 2;
  // The server error code returned by TrustTokenService. See
  // TrustTokenServiceException
  optional int32 server_error_code = 3;
}

/**
 * Logs the internal state in TrustTokenManagerService.
 * Pulled from
 * frameworks/base/services/core/java/com/android/server/security/talisman/TrustTokenManagerService.java
 */
message TrustTokenState {
  // Whether there's TrustTokenService on the device.
  optional bool has_provider = 1;
  // Whether the service has a valid TrustAnchor.
  optional bool has_trust_anchor = 2;
  // Whether the service enters authority fallback mode. I.E. It's only using
  // the root keys from the TrustTokenService.
  optional bool authority_fallback = 3;
  // The count of effective root keys.
  optional int32 root_key_count = 4;
  // The count of VERFIFIED_DEVICE tokens in the dastabase.
  optional int32 device_token_count = 5;
}
