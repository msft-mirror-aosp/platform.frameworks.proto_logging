syntax = "proto2";

package android.os.statsd.keystore;

import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/enums/system/security/keystore2/enums.proto";

option java_package = "com.android.os.keystore";
option java_multiple_files = true;

extend Atom {
  optional Keystore2KeysPerUid keystore2_keys_per_uid = 10248
      [(module_name) = "framework"];
  optional Keystore2PostProcessorInfo keystore2_post_processor_info = 10266
      [(module_name) = "framework"];
  optional Keystore2KeyCreationPerUid keystore2_key_creation_per_uid = 10267
      [(module_name) = "framework"];
  optional Keystore2KeyOperationPerUid keystore2_key_operation_per_uid = 10268
      [(module_name) = "framework"];
}

/**
 * Number of Keystore keys per UID for the top UIDs by key count. The thresholds
 * for the number of UIDs and keys are configured in the code that emits this
 * atom.
 *
 * Logged from: system/security/keystore2/src/metrics.rs via
 * StatsPullAtomService using the IKeystoreMetrics service.
 */
message Keystore2KeysPerUid {
    // UID of the app with Keystore2 keys.
    optional int32 uid = 1 [(is_uid) = true];

    // Number of entries in the "persistent.keyentry" table with domain=APP and
    // namespace equal to the "uid" field. For shared UIDs, this is the total
    // count across all apps sharing the same UID.
    optional int32 key_count = 2;
}

/**
 * Event recorded by the Keystore post processor.
 *
 * Logged from: system/security/keystore2/src/metrics.rs via
 * StatsPullAtomService using the IKeystoreMetrics service.
 */
message Keystore2PostProcessorInfo {
  enum Result {
    RESULT_UNKNOWN = 0;
    // Post processor successfully updated the certificate chain.
    RESULT_SUCCESS = 1;
    // There was a non-fatal error during post processing. Certificate chain
    // may or may not have been updated.
    RESULT_NON_FATAL_FAILURE = 2;
    // Post processing failed due to a failure to communicate with a server.
    RESULT_SERVER_ERROR = 3;
    // Post processing failed due to a failure to decode the new certificate
    // chain.
    RESULT_DECODE_ERROR = 4;
  }
  optional Result result = 1;

  // Number of post processor events with the same field values.
  optional int32 count = 2;
}

/**
 * Logs key creation per UID and security level.
 *
 * Logged from: system/security/keystore2/metrics.rs via StatsPullAtomService
 * using the IKeystoreMetrics service
 */
message Keystore2KeyCreationPerUid {
    // UID of the app that created the key.
    optional int32 uid = 1 [(is_uid) = true];

    // Security level of the key (TEE vs StrongBox).
    optional android.system.security.keystore2.SecurityLevelEnum security_level = 2;

    // Algorithm of the key.
    optional android.system.security.keystore2.Algorithm algorithm = 3;

    // How the user must authenticate in order to use the key.
    optional android.system.security.keystore2.HardwareAuthenticatorType user_auth_type = 4;

    // Whether attestation was requested for the key.
    optional bool attestation_requested = 5;

    // Number of occurrences of this (uid, security_level, algorithm, user_auth_type, attestation_requested) combination.
    optional int32 count = 6;
}

/**
 * Logs key operation per UID and security level.
 *
 * Logged from: system/security/keystore2/metrics.rs via StatsPullAtomService
 * using the IKeystoreMetrics service
 */
message Keystore2KeyOperationPerUid {
    // UID of the app that performed the operation.
    optional int32 uid = 1 [(is_uid) = true];

    // Security level of the key (TEE vs StrongBox).
    optional android.system.security.keystore2.SecurityLevelEnum security_level = 2;

    // Number of occurrences of this (uid, security_level) combination.
    optional int32 count = 3;
}
