syntax = "proto2";

package android.os.statsd.media;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/enums/media/enums.proto";
import "frameworks/proto_logging/stats/enums/media/session/enums.proto";

extend Atom {
  optional MediaSessionCreationReported media_session_creation_reported = 1316
      [(module_name) = "media_metrics"];
}

// Since Android 26Q2
//
// Media Metric that tracks the creation of a media session by the
// android.media.metrics.MediaMetricsManager.
//
// Logged from: frameworks/base/services/core/j/c/a/server/media/metrics/MediaMetricsManagerService
message MediaSessionCreationReported {
  // Randomly generated log session ID. A Base64 encoded hex string representing
  // a 128-bit integer.
  optional string log_session_id = 1;

  // The UID of the application that created the media session.
  optional int32 uid = 2 [(is_uid) = true];

  // The type of the session, corresponding to the sessions defined in
  // android.media.metrics.MediaMetricsManager.
  optional android.media.session.SessionType session_type = 3;
}
