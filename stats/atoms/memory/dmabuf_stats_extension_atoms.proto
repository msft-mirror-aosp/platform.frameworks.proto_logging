syntax = "proto2";

package android.os.statsd.memory;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";

option java_package = "com.android.os.memory";
option java_multiple_files = true;

extend Atom {
    optional DmabufStats dmabuf_stats = 10256 [(module) = "framework"];
}

/**
 * Periodically Logged from libmeminfo to track Dmabuf memory leaks
 */
message DmabufStats {
    //total RSS, exported dmabuf
    optional int32 dmabuf_total_exported_kb = 1;

    //total PSS, userspace dmabuf
    optional int32 dmabuf_userspace_kb = 2;

    //total RSS, unreferenced dmabuf
    optional int32 dmabuf_unreferenced_kb = 3;
}
