syntax = "proto2";

package android.os.statsd.memory;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";

option java_package = "com.android.os.memory";
option java_multiple_files = true;

extend Atom {
  optional SlabInfo slab_info = 10272 [(module_name) = "framework"];
}



/**
 * Periodically Logged from libmeminfo to track slab cache statistics
 */
message SlabInfo {
  optional string name = 1;
  optional int32 total_mem_usage_kb = 2[(unit) = UNIT_KILOBYTES];
}
