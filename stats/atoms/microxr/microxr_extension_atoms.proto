syntax = "proto2";

package android.os.statsd.microxr;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/enums/microxr/enums.proto";

option java_package = "com.android.os.statsd.microxr";
option java_multiple_files = true;

extend Atom {
  // Pushed atoms (platform).
  optional MicroXrDeviceBootCompleteReported
      micro_xr_device_boot_complete_reported = 901 [(module_name) = "microxr"];
  optional MicroXrDonDoffStateChanged micro_xr_don_doff_state_changed = 1182
      [(module_name) = "microxr"];
  optional MicroXrPhotoCaptured micro_xr_photo_captured = 1196
      [(module_name) = "microxr"];
  optional MicroXrVideoCaptured micro_xr_video_captured = 1197
      [(module_name) = "microxr"];
  optional MicroXrOtaReported micro_xr_ota_reported = 1299 [(module_name) = "microxr"];

  // Pushed atoms (generic vendor extensions).
  optional MicroXrSoundTriggerDetected micro_xr_sound_trigger_detected = 300001
      [(module_name) = "microxr-vendor"];
  optional MicroXrAudioPlaybackCompleted micro_xr_audio_playback_completed =
      300002 [(module_name) = "microxr-vendor"];
  optional MicroXrMcuCrashOccurred micro_xr_mcu_crash_occurred = 300000
      [(module_name) = "microxr-vendor"];
  optional MicroXrMcuPowerDeepSleepInfo micro_xr_mcu_power_deep_sleep_info =
      300003 [(module_name) = "microxr-vendor"];
  optional MicroXrMcuBootTimeReported micro_xr_mcu_boot_time_reported = 300004
      [(module_name) = "microxr-vendor"];
  optional MicroXrMcuMemorySnapshotReported
      micro_xr_mcu_memory_snapshot_reported = 300005
      [(module_name) = "microxr-vendor"];
  optional MicroXrApWakeupReported micro_xr_ap_wakeup_reported = 300006
      [(module_name) = "microxr-vendor"];
}

/**
 * Logged when a MicroXR Device is done booting.
 */
message MicroXrDeviceBootCompleteReported {
  // Device ready elapsed time in milliseconds.
  // Logged from microxr-system-ui.
  optional int64 device_ready_time_millis = 1;
}

/**
 * Represents the current Don or Doff state.
 */
enum DonDoffState {
  DON_DOFF_STATE_UNKNOWN = 0;
  // Glasses are "donned", i.e. worn.
  DON_DOFF_STATE_DONNED = 1;
  // Glasses are "doffed", i.e. not worn.
  DON_DOFF_STATE_DOFFED = 2;
  // Don/doff detection is disabled.
  DON_DOFF_STATE_DISABLED = 3;
}

/**
 * Logged each time the don/doff state changed
 *
 * Estimated Logging Rate:
 *   Average on the order of tens per day at most
 */
message MicroXrDonDoffStateChanged {
  optional DonDoffState don_doff_new_state = 1
      [(state_field_option).exclusive_state = true];
}

/**
 * How a photo or video capture was triggered.
 */
enum PhotoOrVideoTrigger {
  // Triggered by an unknown means.
  PHOTO_OR_VIDEO_TRIGGER_UNKNOWN = 0;
  // Triggered by a button press on the glasses.
  PHOTO_OR_VIDEO_TRIGGER_BUTTON = 1;
  // Triggered by a voice command.
  PHOTO_OR_VIDEO_TRIGGER_VOICE = 2;
}

/**
 * Status of a photo or video capture.
 */
enum PhotoOrVideoStatus {
  PHOTO_OR_VIDEO_STATUS_UNKNOWN = 0;
  // Capture success.
  PHOTO_OR_VIDEO_STATUS_SUCCESS = 1;
  // Capture failed for an unspecified reason.
  PHOTO_OR_VIDEO_STATUS_FAILED = 2;
  // Capture failed because another capture was already in progress.
  PHOTO_OR_VIDEO_STATUS_FAILED_IN_PROGRESS = 3;
  // Capture failed due to a thwart check.
  PHOTO_OR_VIDEO_STATUS_FAILED_THWART_CHECK = 4;
  // Capture was disabled to mitigate a thermal problem.
  PHOTO_OR_VIDEO_STATUS_FAILED_THERMAL = 5;
}

/**
 * Reasons for a MCU crash report.
 */
enum McuReportCrashReasons {
  MCU_REPORT_CRASH_REASONS_UNSPECIFIED = 0;
  // Reported when a crash dump is received from the MCU.
  MCU_REPORT_CRASH_REASONS_CRASH = 1;
  // Reported when the MCU stops responding to watchdog pings.
  MCU_REPORT_CRASH_REASONS_WATCHDOG_FAILURE = 2;
}

/**
 * Logged each time a photo is captured.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens per day at most
 */
message MicroXrPhotoCaptured {

  optional PhotoOrVideoTrigger trigger = 1;
  optional PhotoOrVideoStatus status = 2;

  // Time from when photo capture starts until the photo was captured, in
  // milliseconds. Includes ae_latency_ms. If there was a burst of captures
  // (such as for HDR), includes the time to capture all frames in the burst.
  optional int32 latency_ms = 3 [(unit) = UNIT_MILLISECONDS];

  // Time from when photo capture starts until Auto Exposure completes, in
  // milliseconds.
  optional int32 ae_latency_ms = 4 [(unit) = UNIT_MILLISECONDS];

  // The mode of capture used (HDR vs. non-HDR).
  optional CaptureMode capture_mode = 5;

  // Latency from Darklight initiation to camera session acquisition.
  optional int32 capture_session_acquisition_latency_ms = 6 [(unit) = UNIT_MILLISECONDS];

  // Size of the resulting binary file in bytes.
  optional int64 darklight_capture_binary_file_size = 7 [(unit) = UNIT_BYTES];

  // Latency from button down to capturePhoto start.
  // Note: Only applicable if trigger == PHOTO_OR_VIDEO_TRIGGER_BUTTON.
  optional int32 button_to_capture_start_latency_ms = 8 [(unit) = UNIT_MILLISECONDS];

  // Latency from capturePhoto start to base frame metadata.
  optional int32 capture_start_to_base_frame_latency_ms = 9 [(unit) = UNIT_MILLISECONDS];

  // Time from 3A convergence to first burst frame metadata.
  optional int32 first_burst_frame_latency_ms = 10 [(unit) = UNIT_MILLISECONDS];

  // Exposure time for the base frame.
  optional int32 base_frame_exposure_ms = 11 [(unit) = UNIT_MILLISECONDS];

  // Time taken for frame encoding.
  optional int32 encoder_latency_ms = 12 [(unit) = UNIT_MILLISECONDS];

  // Time taken for disk persistence.
  optional int32 persistence_latency_ms = 13 [(unit) = UNIT_MILLISECONDS];

  // Total User Perceived Latency
  // Time from capture issued until the first frame is acquired
  optional int32 shot_latency_ms = 14 [(unit) = UNIT_MILLISECONDS];
}


/**
 * Logged each time a video is captured.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens per day at most
 */
message MicroXrVideoCaptured {
  optional PhotoOrVideoTrigger trigger = 1;
  optional PhotoOrVideoStatus status = 2;

  // Duration of the video, which is the time between capture of the first and
  // last frame, in milliseconds.
  optional int32 duration_ms = 3;

  // Time from when video capture starts until the first frame of the video is
  // captured, in milliseconds. Includes ae_latency_ms.
  optional int32 first_frame_latency_ms = 4;

  // Time from when video capture starts until Auto Exposure completes, in
  // milliseconds.
  optional int32 ae_latency_ms = 5;
}

/**
 * Logged when the MCU crashes.
 */
message MicroXrMcuCrashOccurred {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // Reasons for the crash.
  optional McuReportCrashReasons reason = 2;
}

/**
 * Logged when a sound trigger (hotword) is detected by a local 1st
 * stage activation.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens or hundreds per day at most
 */
message MicroXrSoundTriggerDetected {
  enum ValidationType {
    VALIDATION_TYPE_UNSPECIFIED = 0;
    VALIDATION_TYPE_LOCAL = 1;
    VALIDATION_TYPE_REMOTE = 2;
  }

  enum ValidationStatus {
    VALIDATION_STATUS_UNSPECIFIED = 0;
    VALIDATION_STATUS_ACCEPTED = 1;
    VALIDATION_STATUS_REJECTED = 2;
  }

  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  optional ValidationType validation_type = 2;
  optional ValidationStatus validation_status = 3;
}

/**
 * Transport used by a media stream.
 */
enum MediaTransport {
  MEDIA_TRANSPORT_UNKNOWN = 0;

  // Transports that terminate on the AP (application processor).
  MEDIA_TRANSPORT_A2DP = 1;
  MEDIA_TRANSPORT_RFCOMM = 2;
  MEDIA_TRANSPORT_L2CAP = 3;
  MEDIA_TRANSPORT_WIFI = 4;

  // Transports that terminate on the MCU.
  MEDIA_TRANSPORT_OFFLOADED_A2DP = 5;
  MEDIA_TRANSPORT_OFFLOADED_RFCOMM = 6;
  MEDIA_TRANSPORT_OFFLOADED_L2CAP = 7;
}

/**
 * Logged when an audio playback stream completes.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens per day at most
 */
message MicroXrAudioPlaybackCompleted {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // Transport used by this playback stream.
  optional MediaTransport transport = 2;

  // Duration of the stream, in milliseconds. This is the wallclock duration
  // from stream start until stream end.
  optional int32 duration_ms = 3;

  // Duration of audio actually played, not counting underflows or gaps.
  optional int32 duration_played_ms = 4;

  //
  // Underflows
  //
  // An underflow occurs when audio is written to the speakers more slowly than
  // it is consumed by the speakers. Underflows are usually caused by late
  // arrival of network packets due to abnormally high congestion or latency.
  // Late packets are dropped.
  //
  // One "underflow" is a sequence of dropped packets. Each underflow has two
  // properties: a duration (how many packets were dropped) and a lateness (how
  // late the first underflowed packet arrived relative to its deadline).
  //
  // Underflow statistics are pre-aggregated histograms, instead of a separte
  // atom per underflow event, because this will be logged from an MCU which
  // buffer large queues of atoms and in pathological cases there may be large
  // numbers of underflows.
  //

  // Number of underflows.
  optional int32 underflows_total_count = 5;

  // Total (cumulative) duration of all underflows.
  optional int64 underflows_total_duration_ms = 6;

  // Histogram of underflow durations. Underflows cannot be shorter than the
  // packet duration, which is expected to be about 20ms. Standard advice is to
  // use fewer than 20 bins. Empirically, we expect most underflows are less
  // than 1 second.
  repeated int32 underflows_duration_histogram_ms = 7
      [(histogram_bin_option).explicit_bins = {
        bin: 25
        bin: 50
        bin: 100
        bin: 250
        bin: 500
        bin: 1000
      }];

  // Total (cumulative) lateness of all underflows.
  optional int64 underflows_total_lateness_ms = 8;

  // Histogram of underflow lateness.
  repeated int32 underflows_lateness_histogram_ms = 9
      [(histogram_bin_option).explicit_bins = {
        bin: 25
        bin: 50
        bin: 100
        bin: 250
        bin: 500
        bin: 1000
      }];

  // Maximum size of the jitter buffer during playback.
  optional int32 max_jitter_buffer_ms = 10;
}

/**
 * Logged with certain frequency.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens or hundreds per day at most
 */
message MicroXrMcuPowerDeepSleepInfo {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // Histogram of MCU Sleep Durations.
  repeated int32 duration_ms_histogram_counts = 2
      [(histogram_bin_option).explicit_bins = {
        bin: 1
        bin: 64
        bin: 128
        bin: 256
        bin: 512
        bin: 1024
        bin: 2048
        bin: 4096
        bin: 8192
        bin: 16384
        bin: 32768
      }];

  // Wakeup triggered by Bluetooth activity.
  optional int32 wakeup_reason_bluetooth = 3;

  // Wakeup requested to handle or report a crash/fault.
  optional int32 wakeup_reason_crash_request = 4;

  // Deep sleep entry was preempted, system did not fully sleep.
  // Example: If any interrupt is already pending, the WFI(Wait for intterupt)
  // instruction executed by POWER_EnterDeepSleep() will return immediately and
  // we won't actually enter deep sleep.
  optional int32 wakeup_reason_preempted = 5;

  // Wakeup due to a DMA transfer completion or event.
  optional int32 wakeup_reason_dma = 6;

  // Wakeup triggered by a sensor event.
  // Specific sensor type can be added as a field in the atom if needed.
  // For now, including Proximity Sensor, GPIO.
  optional int32 wakeup_reason_sensor = 7;

  // Wakeup triggered by voice activity detection (e.g., hotword).
  optional int32 wakeup_reason_voice_activity = 8;

  // Wakeup triggered by a dedicated wake signal from the AP/SoC.
  optional int32 wakeup_reason_ap_wake_signal = 9;

  // Wakeup triggered by an internal timer expiration.
  optional int32 wakeup_reason_wake_timer = 10;

  // The maximum sleep duration in ms within the reporting period.
  optional int64 max_sleep_duration_ms = 11;

  // The number of deep sleep entries within the reporting period.
  optional int32 num_sleeps = 12;

  // The total accumulated deep sleep duration in ms within the reporting
  // period.
  optional int64 total_sleep_duration_ms = 13;
}

/**
 * Logged boot time when mcu startup.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens per day at most
 */
message MicroXrMcuBootTimeReported {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // Time taken for the MCU to boot, in milliseconds.
  optional int32 mcu_boot_time_ms = 2;
}

/**
 * Logged MCU memory snapshot.
 *
 * Estimated Logging Rate:
 *   Average on the order of tens or hundreds per day at most
 */
message MicroXrMcuMemorySnapshotReported {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // The total heap size currently available, in kilobytes.
  optional int32 heap_available_kb = 2;
}

/**
 * Reasons for the MCU to wake up the AP.
 */
enum ApWakeupReason {
  AP_WAKEUP_REASON_UNSPECIFIED = 0;
  // Generic RPC traffic (endpoints, resource-lock).
  AP_WAKEUP_REASON_RPC = 1;
  // Ambient Perception service events.
  AP_WAKEUP_REASON_AMBIENT = 2;
  // Audio service events.
  AP_WAKEUP_REASON_AUDIO = 3;
  // Bluetooth service events (including virtual uart).
  AP_WAKEUP_REASON_BLUETOOTH = 4;
  // Display service events.
  AP_WAKEUP_REASON_DISPLAY = 5;
  // Input service events (buttons, touch).
  AP_WAKEUP_REASON_INPUT = 6;
  // Lights service events.
  AP_WAKEUP_REASON_LIGHTS = 7;
  // Log transfer (log service).
  AP_WAKEUP_REASON_LOGGING = 8;
  // Peripherals service events.
  AP_WAKEUP_REASON_PERIPHERALS = 9;
  // Projection tunnel events.
  AP_WAKEUP_REASON_PROJECTION = 10;
  // Sensors service events.
  AP_WAKEUP_REASON_SENSORS = 11;
  // Socket offload / Network events.
  AP_WAKEUP_REASON_NETWORK = 12;
  // Sound trigger (hotword) validation.
  AP_WAKEUP_REASON_SOUND_TRIGGER = 13;
  // Stats transfer.
  AP_WAKEUP_REASON_STATS = 14;
  // Thermal service events.
  AP_WAKEUP_REASON_THERMAL = 15;
  // System management (Lifecycle, Time, Boot params, Build info).
  AP_WAKEUP_REASON_SYSTEM = 16;
  // MCU Crash reporting.
  AP_WAKEUP_REASON_CRASH = 17;
  // Other reasons not specified above.
  AP_WAKEUP_REASON_OTHER = 18;
}

/**
 * Logged when the MCU wakes up the AP.
 *
 * Estimated Logging Rate:
 *   Highly variable. Can be multiple times per hour during active use
 *   or less than once per hour during idle.
 */
message MicroXrApWakeupReported {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  // The reason why the MCU woke up the AP.
  optional ApWakeupReason reason = 2;
}

/**
 * Logged when OTA event is triggered.
 */
message MicroXrOtaReported {
  // The version current OTA event is installed.
  optional string version = 1;

  // The size to update for current OTA event.
  optional int64 update_size_bytes = 2;

  // The companion device associated with the frame.
  optional android.os.statsd.microxr.CompanionDevice companion_device = 3;

  // The update status of current OTA event.
  optional android.os.statsd.microxr.UpdateStatus update_status = 4;

  // The update reason of current OTA event.
  optional android.os.statsd.microxr.UpdateReason update_reason = 5;
}
