syntax = "proto2";

package android.os.statsd.permissioncontroller;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";

// This file contains extension atoms for permission controller.
option java_package = "com.android.os.permissioncontroller";
option java_multiple_files = true;

extend Atom {
  optional PermissionRationaleDialogViewed permission_rationale_dialog_viewed =
      645 [(module_name) = "permissioncontroller"];
  optional PermissionRationaleDialogActionReported
      permission_rationale_dialog_action_reported = 646
      [(module_name) = "permissioncontroller"];
  optional AppDataSharingUpdatesNotificationInteraction
      app_data_sharing_updates_notification_interaction = 647
      [(module_name) = "permissioncontroller"];
  optional AppDataSharingUpdatesFragmentViewed
      app_data_sharing_updates_fragment_viewed = 648
      [(module_name) = "permissioncontroller"];
  optional AppDataSharingUpdatesFragmentActionReported
      app_data_sharing_updates_fragment_action_reported = 649
      [(module_name) = "permissioncontroller"];
  optional EnhancedConfirmationDialogResultReported
      enhanced_confirmation_dialog_result_reported = 827
      [(module_name) = "permissioncontroller"];
  optional EnhancedConfirmationRestrictionCleared
      enhanced_confirmation_restriction_cleared = 828
      [(module_name) = "permissioncontroller"];
  optional RoleSettingsFragmentActionReported
      role_settings_fragment_action_reported = 1020
      [(module_name) = "permissioncontroller"];
  optional EcmRestrictionQueryInCallReported
      ecm_restriction_query_in_call_reported = 1034
      [(module_name) = "permissioncontroller"];
  optional CallWithEcmInteractionReported call_with_ecm_interaction_reported =
      1035 [(module_name) = "permissioncontroller"];
  optional PermissionManagerPageInteraction
      permission_manager_page_interaction = 1049
      [(module_name) = "permissioncontroller"];
  optional RoleSettingsConfirmationDialogActionReported
      role_settings_confirmation_dialog_action_reported = 1205
      [(module_name) = "permissioncontroller"];
  optional RequestReadScreenContextDialogActionReported
      request_read_screen_context_dialog_action_reported = 1300
      [(module_name) = "permissioncontroller"];
  optional DefaultAppSettingsViewed
      default_app_settings_viewed = 1301
      [(module_name) = "permissioncontroller"];
  optional DefaultAssistantSettingsReadScreenContextToggleActionReported
      default_assistant_settings_read_screen_context_toggle_action_reported = 1302
      [(module_name) = "permissioncontroller"];
  optional LocationButtonRequestResultReported location_button_request_result_reported = 1303
      [(module_name) = "permissioncontroller"];
}

/**
* Information about a Permission Rationale dialog viewed by user.
* Logged from ui/model/v34/PermissionRationaleViewModel.java
*/
message PermissionRationaleDialogViewed {
    // id which identifies single session of user interacting with permission controller
    optional int64 session_id = 1;

    // UID of package for which permissions are viewed
    optional int32 uid = 2 [(is_uid) = true];

    // Permission group viewed
    optional string permission_group_name = 3;

    // Data usage purposes shown to user for this permission group in the dialog - bit flags,
    // bit numbers are in accordance with PURPOSE_ constants in DataPurposeConstants.java
    optional int32 purposes_presented = 4;
}

/**
 * Information about a button clicks made by user inside PermissionRationaleActivity
 */
message PermissionRationaleDialogActionReported {
    // id which identifies single session of user interacting with permission controller
    optional int64 session_id = 1;

    // UID of package the permission belongs to
    optional int32 uid = 2 [(is_uid) = true];

    // The permission group currently presented
    optional string permission_group_name = 3;

    enum Button {
        UNDEFINED = 0;
        // Dialog canceled or back clicked
        CANCEL = 1;
        // Link to install source (app store)
        INSTALL_SOURCE = 2;
        // Link to help center article
        HELP_CENTER = 3;
        // Link to permission settings
        PERMISSION_SETTINGS = 4;
    }

    // Button pressed in the dialog
    optional Button button_pressed = 4;
}

/**
 * Information about AppDataSharingUpdates notification and interaction
 */
message AppDataSharingUpdatesNotificationInteraction {
    // Session Id to link the notification with the issue card.
    optional int64 session_id = 1; // to map the notification and issue card interaction

    enum Action {
        UNKNOWN = 0;
        NOTIFICATION_SHOWN = 1;
        NOTIFICATION_CLICKED = 2;
        DISMISSED = 3;
    }

    // Action taken on the notification.
    optional Action action = 2;

    // Number app data sharing updates represented by the notification
    optional int32 number_of_app_updates = 3;
}

/**
* Information about AppDataSharingUpdatesFragment viewed by user.
* Logged from ui/model/v34/AppDataSharingUpdatesViewModel.java
*/
message AppDataSharingUpdatesFragmentViewed {
    // id which identifies single session of user interacting with permission controller
    optional int64 session_id = 1;

    // Number of app data sharing updates displayed when viewed
    optional int32 number_of_app_updates = 2;
}

/**
 * Information about a button clicks made by user inside AppDataSharingUpdatesFragment
 */
message AppDataSharingUpdatesFragmentActionReported {
    // id which identifies single session of user interacting with permission controller
    optional int64 session_id = 1;

    // UID of package the interacted data sharing update belongs to
    optional int32 uid = 2 [(is_uid) = true];

    enum DataSharingChange {
        UNKNOWN = 0;
        ADDS_ADVERTISING_PURPOSE = 1;
        ADDS_SHARING_WITHOUT_ADVERTISING_PURPOSE = 2;
        ADDS_SHARING_WITH_ADVERTISING_PURPOSE = 3;
    }

    // Data sharing change associated with this data sharing update
    optional DataSharingChange data_sharing_change = 3;
}

/**
 * Logged when the ECM (Enhanced Confirmation Mode) dialog is closed.
 *
 * Logs from: com.android.permissioncontroller
 *            .permission.ui.GrantPermissionsActivity
 *
 */
message EnhancedConfirmationDialogResultReported {
  // UID of the restricted app
  optional int32 uid = 1 [(is_uid) = true];

  // Identifier of the restricted setting
  optional string setting_identifier = 2;

  // True if this is the first time showing this dialog for this app
  optional bool first_show_for_app = 3;

  enum SettingType {
    SETTING_TYPE_UNSPECIFIED = 0;
    SETTING_TYPE_APPOP = 1;
    SETTING_TYPE_PERMISSION = 2;
    SETTING_TYPE_ROLE = 3;
    SETTING_TYPE_OTHER = 4;
  }

  // Which type of resource setting_identifier refers to
  optional SettingType setting_type = 4;

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_CANCELLED = 1;
    RESULT_LEARN_MORE = 2;
    RESULT_OK = 3;
    RESULT_SUPPRESSED = 4;
  }

  // Which button or action the user invoked to close the dialog
  optional Result result = 5;
}

/**
 * Logged when an app's ECM (Enhanced Confirmation Mode) restriction
 * status is cleared by the user.
 *
 * Logs from: com.android.ecm.EnhancedConfirmationService
 *
 */
message EnhancedConfirmationRestrictionCleared {
  // UID of the restricted app
  optional int32 uid = 1 [(is_uid) = true];
}

/**
 * Reports that User has changed a default app for a role in settings.
 * Logged from:
 *   packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/role/ui/DefaultAppChildFragment.java
 * Estimated Logging Rate:
 *   Peak: few times per device per week | Avg: Between 0 and 1 times per device per day
 */
message RoleSettingsFragmentActionReported {
  // UID of application assigned the role
  optional int32 uid = 1 [(is_uid) = true];

  // Package name of application assigned the role
  optional string package_name = 2;

  optional string role_name = 3;
}

/*
 * Reports that the Enhanced Confirmation Service has received a query to the restriction state of
 * a setting that is restricted while in an untrusted call.
 * Logs from: com.android.ecm.EnhancedConfirmationService
 */
message EcmRestrictionQueryInCallReported {
  // UID of the possibly restricted app
  optional int32 uid = 1 [(is_uid) = true];

  // The setting being checked
  optional string setting_identifier = 2;

  // Whether or not the setting was allowed (vs. restricted)
  optional bool allowed = 3;

  // Whether a call was in progress at the time of this restriction check
  optional bool call_in_progress = 4;

  // Whether the call was incoming. False, if there was no call
  optional bool call_incoming = 5;

  // Whether the call was trusted. True, if there was no call
  optional bool call_trusted = 6;

  // Whether a block had happened in the past hour for the given call. False if there is no call.
  optional bool call_back_after_block = 7;
}

/*
 * Reports that a call happened, during which the EnhancedConfirmation Service was queried for the
 * restriction state of a setting that is restricted while in an untrusted call.
 * Logs from: com.android.ecm.EnhancedConfirmationService
 */
message CallWithEcmInteractionReported {
    // Whether any setting was blocked during the call
    optional bool any_setting_blocked = 1;
    // The call duration, in seconds
    optional int32 duration_secs = 2;
}

/**
* Capture user interactions with the permission manager page.
* Logged from ManageStandardPermissionsFragment.java, and
* ManageCustomPermissionsFragment.java
*/
message PermissionManagerPageInteraction {
    // id which identifies single session of user interacting with
    // permission manager page
    optional int64 session_id = 1;

    enum Action {
        UNKNOWN = 0;
        PERMISSION_MANAGER_OPENED = 1;
        UNUSED_APPS_LEARN_MORE_CLICKED = 2;
        STANDARD_PERMISSION_GROUP_CLICKED = 3;
        ADDITIONAL_PERMISSIONS_CLICKED = 4;
        ADDITIONAL_PERMISSION_GROUP_CLICKED = 5;
    }

    // The action the user took to interact with the fragment
    optional Action action = 2;
    // The permission group the user interacted with, only applies to
    // STANDARD_PERMISSION_GROUP_CLICKED and ADDITIONAL_PERMISSION_GROUP_CLICKED
    optional string permission_group_name = 3;
}

/**
 * Reports that User has confirmed the change of a default app for a role in settings.
 * Logged from:
 *   packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/role/ui/DefaultAppConfirmationDialogFragment.java
 * Estimated Logging Rate:
 *   Peak: few times per device per week | Avg: Between 0 and 1 times per device per day
 */
message RoleSettingsConfirmationDialogActionReported {
  // UID of application assigned the role
  optional int32 uid = 1 [(is_uid) = true];

  // Package name of application assigned the role
  optional string package_name = 2;

  optional string role_name = 3;

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_CANCELLED = 1;
    RESULT_OK = 2;
  }

  // Which button or action the user invoked to close the dialog
  optional Result result = 4;
}

/**
 * Information about a Request Read Screen Context dialog actions by user.
 * Logged from:
 *   Logged from packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/role/ui/v37/RequestReadScreenContextActivity.kt
 * Estimated Logging Rate:
 *   Peak: few times per device per week | Avg: Between 0 and 1 times per device per day
 */
message RequestReadScreenContextDialogActionReported {
    // UID of application assigned the role
    optional int32 uid = 1 [(is_uid) = true];

    // Package name of application assigned the role
    optional string package_name = 2;

    enum Result {
        RESULT_UNSPECIFIED = 0;
        // request was ignored
        RESULT_IGNORED = 1;
        // request was ignored because it's already granted
        RESULT_IGNORED_ALREADY_GRANTED = 2;
        // request was ignored because access for app was determined to be unrequestable
        RESULT_IGNORED_UNREQUESTABLE = 3;
        // request was ignored because user denied max number of times
        RESULT_IGNORED_UNREQUESTABLE_MAX_USER_DENIALS = 4;
        // Request canceled by user
        RESULT_CANCELED = 5;
        // granted by user action
        RESULT_USER_GRANTED = 6;
        // denied by user action
        RESULT_USER_DENIED = 7;
    }
    // The result of the request
    optional Result result = 3;
}

/**
 * Reports that User has viewed the default app for a role in settings.
 * Logged from:
 *   packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/role/ui/DefaultAppChildFragment.java
 * Estimated Logging Rate:
 *   Peak: few times per device per week | Avg: Between 0 and 1 times per device per day
 */
message DefaultAppSettingsViewed {
  optional string role_name = 1;
}

/**
 * Information about a Request Read Screen Context setting toggle actions by user.
 * Logged from:
 *   Logged from packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/role/ui/DefaultAppChildFragment.java
 * Estimated Logging Rate:
 *   Peak: few times per device per week | Avg: Between 0 and 1 times per device per day
 */
message DefaultAssistantSettingsReadScreenContextToggleActionReported {
    // UID of application for which the read screen context setting was enabled
    optional int32 uid = 1 [(is_uid) = true];

    // Package name of application for which the read screen context setting was enabled
    optional string package_name = 2;

    // True if toggle is placed in allowed state
    optional bool allowed = 3;
}

/**
 * Reports precise location permission grant result initiated via the Location Button.
 * Logged from:
 *   packages/modules/Permission/PermissionController/src/com/android/permissioncontroller/permission/ui/model/v37/LocationButtonViewModel.kt
 * Estimated Logging Rate:
 *   Peak: few times per device per day | Avg: Between 0 and 1 times per device per day
 */
message LocationButtonRequestResultReported {
  // Id which identifies single location button session across SystemUI and PC process.
  optional int64 session_id = 1;
  // UID of package requesting the location permission grant
  optional int32 uid = 2 [(is_uid) = true];
  // Name of package requesting the location permission grant.
  optional string package_name = 3;

  // Name of permissions, which can be granted by location button.
  enum Permission {
    PERMISSION_UNSPECIFIED = 0;
    ACCESS_FINE_LOCATION = 1;
  }
  optional Permission permission = 4;

  enum Result {
    RESULT_UNSPECIFIED = 0;
    // Permission was already granted before this request.
    ALREADY_GRANTED = 1;
    // Permission cannot be granted (e.g., user or policy fixed).
    NOT_GRANTABLE = 2;
    // Permission granted automatically by policy without user prompt.
    POLICY_AUTO_GRANTED = 3;
    // Permission denied automatically by policy without user prompt.
    POLICY_AUTO_DENIED = 4;
    // Permission granted directly without showing a consent dialog.
    DIRECT_GRANT = 5;
    // Permission granted after showing the consent dialog to the user.
    PROMPT_GRANT = 6;
    // Permission denied by the user via the consent dialog.
    DENIED = 7;
  }
  optional Result result = 5;
}
