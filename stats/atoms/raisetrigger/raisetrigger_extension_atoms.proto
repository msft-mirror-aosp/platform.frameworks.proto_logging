syntax = "proto2";

package android.os.statsd.raisetrigger;

import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/atoms.proto";

option java_package = "com.android.os.raisetrigger";
option java_multiple_files = true;

extend Atom {
  // Pushed atoms (generic vendor extensions).
  optional RaiseTriggerAudioDetected raise_trigger_audio_detected = 300007
      [(module_name) = "raisetrigger-vendor"];
}

message RaiseTriggerAudioDetected {
  // Atoms logged from Vendor require a reverse domain name field.
  // The expected value is "";
  optional string reverse_domain_name = 1;

  optional int32 first_stage_vad_triggered_count = 2;
  optional int32 second_stage_vad_triggered_count = 3;
  optional int32 second_stage_vad_version = 4;
  optional int32 second_stage_vad_canceled_count = 5;
  optional int32 second_stage_vad_failed_count = 6;
  optional float second_stage_vad_threshold = 7;
  optional int32 second_stage_vad_trigger_elapsed_duration_ms = 8[(unit) = UNIT_MILLISECONDS];
  optional int32 second_stage_vad_canceled_elapsed_duration_ms = 9[(unit) = UNIT_MILLISECONDS];
  optional float second_stage_vad_max_volume = 10;
  optional float second_stage_vad_min_volume = 11;
}
