syntax = "proto2";

package android.os.statsd.ranging;

import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/enums/ranging/enums.proto";

option java_package = "com.android.os.ranging";
option java_multiple_files = true;

extend Atom {
  optional RangingSessionConfigured ranging_session_configured = 993
      [(module) = "ranging"];
  optional RangingSessionStarted ranging_session_started = 994
      [(module) = "ranging"];
  optional RangingSessionClosed ranging_session_closed = 995
      [(module) = "ranging"];
  optional RangingTechnologyStarted ranging_technology_started = 996
      [(module) = "ranging"];
  optional RangingTechnologyStopped ranging_technology_stopped = 997
      [(module) = "ranging"];
  optional RangingPeerDisconnectedAtRange ranging_peer_disconnected_at_range =
      1215 [(module) = "ranging"];
  optional RangingPeerDisconnectedWithRssi ranging_peer_disconnected_with_rssi =
      1219 [(module) = "ranging"];
  optional RangingPeerDisconnectedWithDelaySpread
      ranging_peer_disconnected_with_delay_spread = 1220 [(module) = "ranging"];
  optional RangingPeerDisconnectedWithConfidenceLevel
      ranging_peer_disconnected_with_confidence_level = 1221
      [(module) = "ranging"];
}

/*
 * A ranging session has been configured, either after OOB negotiation or
 * directly from raw parameters.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingSessionConfigured {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // The duration it took to do OOB in milliseconds. Omitted if the session was
  // configured directly.
  optional int64 oob_duration_ms = 2;

  // Whether the configuration was reached via OOB negotiation or provided
  // directly through the API.
  optional android.ranging.SessionType type = 3;

  // The role of the local device in this session.
  optional android.ranging.DeviceRole device_role = 4;

  // Number of peers to range with as specified in the configuration.
  optional int32 num_peers = 5;

  // UID of the process that started this session through the API.
  optional int32 uid = 6 [(is_uid) = true];
}

/*
 * A ranging session has started.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingSessionStarted {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // UID of the process that requested ranging through the API.
  optional int32 uid = 2 [(is_uid) = true];

  // The duration it took to start the session after configuring in
  // milliseconds.
  optional int64 start_latency_ms = 3;

  // Whether the process that requested ranging is privileged.
  optional bool is_privileged = 4;
}

/*
 * A ranging session has been closed.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingSessionClosed {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // State the session was in before it closed.
  optional android.ranging.SessionState last_state = 2;

  // Duration the session was in the 'last_state' before closing, in
  // milliseconds.
  optional int64 last_state_duration_ms = 3;

  // Reason why the session closed.
  optional android.ranging.Reason reason = 4;

  // UID of the process that started this session through the API.
  optional int32 uid = 5 [(is_uid) = true];
}

/*
 * A ranging technology has started within a session.
 *
 * Logged from:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 2 times per hour per device
 *   Avg: 2 times per day per device
 */
message RangingTechnologyStarted {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // Technology that started.
  optional android.ranging.Technology technology = 2;

  // Number of peers that started using this technology.
  optional int32 num_peers = 3;

  // UID of the process that started this session through the API.
  optional int32 uid = 4 [(is_uid) = true];
}

/*
 * A ranging technology has stopped within a session.
 *
 * Logged from:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 2 times per hour per device
 *   Avg: 2 times per day per device
 */
message RangingTechnologyStopped {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // Technology that stopped.
  optional android.ranging.Technology technology = 2;

  // State the session was in when this technology stopped.
  optional android.ranging.SessionState state = 3;

  // Reason why this technology stopped.
  optional android.ranging.Reason reason = 4;

  // Number of peers that stopped using this technology.
  optional int32 num_peers = 5;

  // UID of the process that started this session through the API.
  optional int32 uid = 6 [(is_uid) = true];
}

/*
 * A peer has disconnected from a session.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingPeerDisconnectedAtRange {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // UID of the process that started this session through the API.
  optional int32 uid = 2 [(is_uid) = true];

  // Technology that the peer was using when it disconnected.
  optional android.ranging.Technology technology = 3;

  // Device type of the peer that disconnected.
  optional android.ranging.DeviceType peer_type = 4;

  // Last range (meters) measured before the peer disconnected.
  optional float last_range_m = 5;
}

/*
 * A peer has disconnected from a session.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingPeerDisconnectedWithRssi {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // UID of the process that started this session through the API.
  optional int32 uid = 2 [(is_uid) = true];

  // Technology that the peer was using when it disconnected.
  optional android.ranging.Technology technology = 3;

  // Device type of the peer that disconnected.
  optional android.ranging.DeviceType peer_type = 4;

  // Last RSSI (dBm) measured before the peer disconnected.
  optional int32 last_rssi_dbm = 5;
}

/*
 * A peer has disconnected from a session.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingPeerDisconnectedWithDelaySpread {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // UID of the process that started this session through the API.
  optional int32 uid = 2 [(is_uid) = true];

  // Technology that the peer was using when it disconnected.
  optional android.ranging.Technology technology = 3;

  // Device type of the peer that disconnected.
  optional android.ranging.DeviceType peer_type = 4;

  // Last delay spread (meters) measured before the peer disconnected.
  optional int32 delay_spread_m = 5;
}

/*
 * A peer has disconnected from a session.
 *
 * Logged From:
 *   android.server.ranging.metrics.SessionMetricsLogger
 * Estimated Logging Rate:
 *   Peak: 1 time per hour per device
 *   Avg: 1 time per day per device
 */
message RangingPeerDisconnectedWithConfidenceLevel {
  // Unique identifier for the session.
  optional int64 session_id = 1;

  // UID of the process that started this session through the API.
  optional int32 uid = 2 [(is_uid) = true];

  // Technology that the peer was using when it disconnected.
  optional android.ranging.Technology technology = 3;

  // Device type of the peer that disconnected.
  optional android.ranging.DeviceType peer_type = 4;

  // Last confidence level (0-1) measured before the peer disconnected.
  optional int32 confidence_level = 5;
}
