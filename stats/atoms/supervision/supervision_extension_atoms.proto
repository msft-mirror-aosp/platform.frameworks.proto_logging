syntax = "proto2";

package android.os.statsd.supervision;

import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/atoms.proto";

extend Atom {
  optional SupervisionState supervision_state = 10258
      [(module_name) = "framework"];
}

message SupervisionState {
  // Whether supervision is enabled on the device.
  optional bool is_supervision_enabled = 1;

  // Whether supervision PIN is set on the device.
  optional bool is_credential_set = 2;

  // State of the supervision PIN recovery method, with -1 indicating unset.
  optional int32 recovery_state = 3;

  // Android user ID represents full users only.
  optional int32 user_id = 4;
}
