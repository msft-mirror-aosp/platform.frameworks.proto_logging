syntax = "proto2";

package android.os.statsd.telephony;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";
import "frameworks/proto_logging/stats/enums/telephony/enums.proto";

option java_package = "com.android.os.telephony";
option java_multiple_files = true;

extend Atom {
  optional CellularRadioPowerStateChanged cellular_radio_power_state_changed =
      713 [(module_name) = "telephony"];
  optional EmergencyNumbersInfo emergency_numbers_info = 10180
      [(module_name) = "telephony"];
  optional DataNetworkValidation data_network_validation = 10207
      [(module_name) = "telephony"];
  optional DataRatStateChanged data_rat_state_changed = 854
      [(module_name) = "telephony"];
  optional ConnectedChannelChanged connected_channel_changed = 882
      [(module_name) = "telephony"];
  optional SmsOtpRedacted sms_otp_redacted = 1136 [(module_name) = "telephony"];
  optional SmsOtpEvaluation sms_otp_evaluation = 1137
      [(module_name) = "telephony"];
  optional CarrierPrivilegesReported carrier_privileges_reported = 1252
      [(module_name) = "telephony"];
  optional CarrierServiceConfigOverridesReported
      carrier_service_config_overrides_reported = 1270
      [(module_name) = "telephony"];
    optional MessageUpgradeResolved message_upgrade_resolved = 1345
    [(module_name) = "telephony"];
    optional MessageUpgradeIntentCached message_upgrade_intent_cached = 1346
    [(module_name) = "telephony"];
  // 10208 is reserved due to removing the old atom.
}

message CarrierPrivilegesReported {
    // The carrier id of the SIM.
    optional int32 sim_carrier_id = 1;
    // The number of packages granted carrier privileges by the SIM.
    optional int32 sim_privileged_package_count = 2;
    // The number of packages granted carrier privileges by device configuration.
    optional int32 config_privileged_package_count = 3;
}


/**
 *
 * Logged from
 * packages/services/Telephony/src/com/android/phone/CarrierConfigLoader.java
 * Logs during phone event EVENT_CONNECTED_TO_CARRIER.
 * Fires during device boot or sim card change for minority of users.
 *
 * Estimated Logging Rate:
 * Peak: < 0.1 per device per day
 */

message CarrierServiceConfigOverridesReported {
    // The carrier id of the SIM.
    optional int32 carrier_id = 1;
    // The package uid of the carrier service app attempting to override.
    optional int32 carrier_service_package_uid = 2 [(is_uid) = true];
    // The package uids of the apps which could receive extra privileges.
    repeated int32 package_uids = 3 [(is_uid) = true];
}

message CellularRadioPowerStateChanged {
    optional android.telephony.CellularRadioPowerStateEnum state = 1
            [(state_field_option).exclusive_state = true, (state_field_option).nested = false];
}

/**
 * pulled atom to capture all emergency numbers information stored.
 */
message EmergencyNumbersInfo {
    // flag for db version ignored
    optional bool is_db_version_ignored = 1;

    // version number read from assets
    optional int32 asset_version = 2;

    // version number from OTA updated DB
    optional int32 ota_version = 3;

    // the emergency number
    optional string number = 4;

    // iso code for the country
    optional string country_iso = 5;

    // Carrier mnc
    optional string mnc = 6;

    // call route associated with emergency number.
    optional android.telephony.CallRoute route = 7;

    // list of URNs associated with emergency number.
    repeated string urns = 8;

    // service categories of the emergency number.
    repeated android.telephony.ServiceCategory service_categories = 9;

    // sources of the captured emergency number.
    repeated android.telephony.Source sources = 10;
}

/**
 * Pulls information for a data network validation
 *
 * Each pull creates multiple atoms, one for each data network validation.
 *
 * Pulled from:
 *   frameworks/opt/telephony/src/java/com/android/internal/telephony/metrics/MetricsCollector.java
 */
message DataNetworkValidation {
    // Data RAT when network validation was performed
    // Used as a dimension
    optional android.telephony.NetworkTypeEnum network_type = 1;

    // APN type bitmask where network verification was performed
    // @ApnType in frameworks/base/telephony/java/android/telephony/Annotation.java
    optional int32 apn_type_bitmask = 2;

    // Signal strength when network validation was performed
    optional android.telephony.SignalStrengthEnum signal_strength = 3;

    // Result of network validation for one request
    optional android.telephony.NetworkValidationResult validation_result = 4;

    // The time in milliseconds from requesting network validation to receiving
    optional int64 elapsed_time_in_millis = 5;

    // Boolean that handover attempted during validation.
    optional bool handover_attempted = 6;

    // Number of network validation
    optional int32 network_validation_count = 7;
}

/**
 * Data connection changing event.
 *
 * Logged from:
 *   frameworks/opt/telephony/src/java/com/android/internal/telephony/metrics/DataConnectionStateTracker.java
 */
message DataRatStateChanged {
    enum DataRat {
        DATA_RAT_UNSPECIFIED = 0;
        NO_SIM = 1;
        DATA_RAT_2G = 2;
        DATA_RAT_3G = 3;
        DATA_RAT_4G_LTE = 4;
        DATA_RAT_5G_NSA_LTE = 5;
        DATA_RAT_5G_NSA_FR1 = 6;
        DATA_RAT_5G_NSA_FR2 = 7;
        DATA_RAT_5G_SA_FR1 = 8;
        DATA_RAT_5G_SA_FR2 = 9;
    }

    optional DataRat data_rat = 1 [
    (state_field_option).exclusive_state = true,
    (state_field_option).nested = false
  ];
}

/**
 * Physical channel changing event.
 *
 * Logged from:
 *   frameworks/opt/telephony/src/java/com/android/internal/telephony/metrics/DataConnectionStateTracker.java
 */
message ConnectedChannelChanged {
    enum ChannelCount {
        CHANNEL_COUNT_UNSPECIFIED = 0;
        // CHANNEL_COUNT_ONE indicates there is 0 or 1 connected channel
        CHANNEL_COUNT_ONE = 1;
        // CHANNEL_COUNT_TWO indicates there are 2 connected channels
        CHANNEL_COUNT_TWO = 2;
        CHANNEL_COUNT_THREE = 3;
        CHANNEL_COUNT_FOUR = 4;
        CHANNEL_COUNT_FIVE = 5;
    }

    optional ChannelCount connected_channel_count = 1 [
    (state_field_option).exclusive_state = true,
    (state_field_option).nested = false
  ];
}

/**
 *
 * Report a package is forbidden from receiving information about an SMS that contains an OTP
 * (One Time Password).
 *
 * Logged from:
 *
 * frameworks/opt/telephony/src/java/com/android/internal/telephony/InboundSmsHandler.java and
 * packages/providers/TelephonyProvider/src/com/android/providers/telephony/SmsProvider.java
 *
 * Estimated Logging Rate:
 * Peak: 1 per UID, per redaction location, on the device every 24 hours
 *
 */
message SmsOtpRedacted {
    // The UID who was restricted from receiving SMS data
    optional int32 redacted_uid = 1 [(is_uid) = true];
    // The type of OTP redaction algorithm used
    optional android.telephony.SmsOtpRedactionAlgorithm redaction_algorithm = 2;
    // The place where redaction took place
    optional android.telephony.SmsOtpRedactionLocation redaction_location = 3;
    // The number of times a redacted call for this uid, algorithm, and location happened in the
    // last 24 hours
    optional int32 event_count_24_hours = 4;
}

/**
 *
 * Logged from
 * frameworks/opt/telephony/src/java/com/android/internal/telephony/InboundSmsHandler.java and
 * packages/providers/TelephonyProvider/src/com/android/providers/telephony/SmsProvider.java
 * When an SMS is evaluated to see if it contains an OTP. These will be stored, and uploaded once
 * every 24 hours, in shuffled order.
 *
 * Estimated Logging Rate:
 * Peak: 2 times per SMS message per device
 */
message SmsOtpEvaluation {
    enum OtpEvaluationResult {
        // The message wasn't checked for an OTP
        EVALUATION_RESULT_NOT_CHECKED = 0;
        // The message was checked, but didn't contain an OTP
        EVALUATION_RESULT_NO_OTP = 1;
        // The message contained an OTP
        EVALUATION_RESULT_HAS_OTP = 2;
    }

    // The time a redaction check took. -1 for NOT_CHECKED
    optional int32 redaction_time_ms = 1;
    // The result of OTP evaluation
    optional OtpEvaluationResult result = 2;
    // The type of OTP redaction algorithm used
    optional android.telephony.SmsOtpRedactionAlgorithm redaction_algorithm = 3;
    // The place where redaction took place
    optional android.telephony.SmsOtpRedactionLocation redaction_location = 4;
}

/**
 *
 * Logged from
 * opt/telephony/src/java/com/android/internal/telephony/SMSDispatcher.java and
 * services/Mms/src/com/android/mms/service/MmsService.java
 * When SMS/MMS are evaluated to see if an upgrade should be performed and either succeeds,
 * fails, or skips the operation.
 *
 * Estimated Logging Rate:
 * Peak: 1 time per SMS/MMS message per device
 */
message MessageUpgradeResolved {

    // The entity that initiated the upgrade request
    optional android.telephony.SourceType source_type = 1;

    // The type of the original message attempting the upgrade
    optional android.telephony.OriginalMessageType original_message_type = 2;

    enum Status {
        STATUS_UNKNOWN = 0;
        // Feature not available or supported for this request
        STATUS_NOT_SUPPORTED = 1;
        // Upgrade was successful, and the intent was sent
        STATUS_SUCCEEDED = 2;
        // Upgrade was attempted but failed for some reason
        STATUS_FAILED = 3;
    }
    // The outcome of the upgrade attempt
    optional Status status = 3;

    // Latency from the start of the upgrade check to this resolution event, in milliseconds.
    optional int32 upgrade_latency_ms = 4 [(unit) = UNIT_MILLISECONDS];

    // UID of the app package that is currently set as the default SMS role holder.
    optional int32 default_sms_app_uid = 5 [(is_uid) = true];
}

/**
 *
 * Logged from
 * base/telephony/java/android/telephony/MessageUpgradeWorker.java
 * When a PendingIntent for a message upgrade request is added to the local cache,
 * and subsequently when it is removed (either because it was successfully dispatched or
 * evicted due to the cache reaching its size limit.
 *
 * Estimated Logging Rate:
 * Peak: 2 times per SMS/MMS message per device (once on addition, once on removal).
 */
message MessageUpgradeIntentCached {
    // The entity that initiated the upgrade request
    optional android.telephony.SourceType source_type = 1;
    // The type of the original message to upgrade
    optional android.telephony.OriginalMessageType upgrade_type = 2;

    enum CacheEvent {
        CACHE_EVENT_UNKNOWN = 0;
        // Intent was added to the cache
        CACHE_EVENT_ADDED = 1;
        // Intent was removed because it was successfully dispatched
        CACHE_EVENT_REMOVED_DISPATCHED = 2;
        // Intent was removed because the upgrade request was rejected or failed
        CACHE_EVENT_REMOVED_REJECTED = 3;
        // Intent was removed because the cache reached its size limit
        CACHE_EVENT_REMOVED_EVICTED = 4;
    }
    // The lifecycle event being reported
    optional CacheEvent cache_event = 3;

    enum IntentType {
        UPGRADE_INTENT_UNKNOWN = 0;
        UPGRADE_INTENT_SENT = 1;
        UPGRADE_INTENT_DELIVERY = 2;
    }

    // The type of the intent being reported
    optional IntentType intent_type = 4;

    // Time this intent spent in the cache, in milliseconds.
    // Only populated if cache_event is a REMOVED state (DISPATCHED or EVICTED).
    optional int32 time_in_cache_ms = 5 [(unit) = UNIT_MILLISECONDS];
}
