 syntax = "proto2";

 package android.os.statsd.usb;

 import "frameworks/proto_logging/stats/atom_field_options.proto";
 import "frameworks/proto_logging/stats/atoms.proto";
 import "frameworks/proto_logging/stats/enums/usb/enums.proto";

 option java_package = "com.android.os.usb";
 option java_multiple_files = true;

 extend Atom {
   optional UsbUserspaceAoaEnabled usb_userspace_aoa_enabled = 1211
       [(module_name) = "framework"];
 }

 // Atom to report the Userspace AOA implementation state.
 // Logged once on boot from UsbDeviceManager.java.
 message UsbUserspaceAoaEnabled {
   // Overall state of the Userspace AOA implementation. This is the primary
   // signal indicating if the feature is active.
   optional android.os.usb.UserspaceAoaState state = 1;

   // The fields below provide a breakdown of the conditions that determine the
   // overall 'state'. They are most useful for debugging when the state is
   // STATE_DISABLED.

   // Represents the state of the primary feature flag for userspace AOA.
   // A value of 'true' indicates that the feature is enabled via Flags.enableAoaUserspaceImplementation.
   optional bool userspace_aoa_feature_enabled = 2;

   // Result of checking for the presence and accessibility of the native
   // FunctionFS (FFS) directories required for AOA communication.
   // A value of 'true' means the check passed. A failure here is a fatal error
   // for userspace AOA initialization.
   optional bool native_ffs_directories_check_passed = 3;

   // Result of the attempt to open the accessory control endpoint via the
   // native nativeOpenAccessoryControl() function. This is a critical step for
   // the system to be able to communicate with AOA accessories.
   optional android.os.usb.OpenAccessoryControlResult open_control_result = 4;

   // Represents the state of the device-specific system property that can
   // override the feature flag.
   // A value of 'true' indicates that the property 'DEVICE_UAOA_ENABLED_PROPERTY'
   // is set to true, enabling the feature for this device model.
   optional bool device_enabled_for_userspace_aoa = 5;
 }