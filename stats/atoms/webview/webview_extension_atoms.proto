syntax = "proto2";

package android.os.statsd.webview;

import "frameworks/proto_logging/stats/atoms.proto";
import "frameworks/proto_logging/stats/atom_field_options.proto";

extend Atom {
  optional WebViewPinQuota webview_pin_quota = 10269 [(module_name) = "framework"];
}

message WebViewPinQuota {
  optional int32 size_bytes = 1 [(unit) = UNIT_BYTES];
}