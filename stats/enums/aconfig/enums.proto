syntax = "proto2";

package android.os.statsd.aconfig;

option java_package = "com.android.os.aconfig";
option java_multiple_files = true;

enum AconfigOperation {
  ACONFIG_OPERATION_UNSPECIFIED = 0;

  ACONFIG_OPERATION_LOAD_PLATFORM_PACKAGE_MAP = 1;
  ACONFIG_OPERATION_LOAD_MAINLINE_PACKAGE_MAP = 2;
}

enum AconfigError {
  ACONFIG_ERROR_UNSPECIFIED = 0;
}
