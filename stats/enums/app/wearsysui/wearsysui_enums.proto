syntax = "proto2";

package android.app.wearsysui;

option java_multiple_files = true;
option java_outer_classname = "WearSysUiEnums";

// This enum depicts the text type of the content shown in WFCO.
// Next ID: 3
enum WatchFaceContentOverlayTextType {
  // The data type is not specified.
  TEXT_TYPE_UNSPECIFIED = 0;
  // Simple, non-interactive text.
  TEXT_TYPE_STATIC = 1;
  // Dynamic Text like chronometer, such as a timer or stopwatch, media etc.
  TEXT_TYPE_DYNAMIC = 2;
}

// This enum depicts the type of content entry shown in WFCO.
// Next ID: 3
enum WatchFaceContentOverlayEntryType {
  // The entry type is not specified.
  ENTRY_TYPE_UNSPECIFIED = 0;
  // A live update, such as a ride-sharing ETA.
  ENTRY_TYPE_LIVE_UPDATE = 1;
  // An ongoing activity, such as a workout or timer.
  ENTRY_TYPE_ONGOING_ACTIVITY = 2;
}
