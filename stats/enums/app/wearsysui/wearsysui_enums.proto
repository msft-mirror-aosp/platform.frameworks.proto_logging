syntax = "proto2";

package android.app.wearsysui;

option java_multiple_files = true;
option java_outer_classname = "WearSysUiEnums";

// This enum depicts the text type of the content shown in Live Entry UI.
// Next ID: 3
enum LiveEntryTextType {
  // The data type is not specified.
  TEXT_TYPE_UNSPECIFIED = 0;
  // Simple, non-interactive text.
  TEXT_TYPE_STATIC = 1;
  // Dynamic Text like chronometer, such as a timer or stopwatch, media etc.
  TEXT_TYPE_DYNAMIC = 2;
}

// This enum depicts the type of content shown in Live Entry UI.
// Next ID: 3
enum LiveEntryContentType {
  // The entry type is not specified.
  CONTENT_TYPE_UNSPECIFIED = 0;
  // A live update, such as a ride-sharing ETA.
  CONTENT_TYPE_LIVE_UPDATE = 1;
  // An ongoing activity, such as a workout or timer.
  CONTENT_TYPE_ONGOING_ACTIVITY = 2;
}
// Quick Setting option selected by the user
// Next ID: 3
enum QuickSettingOption {
  // Option unspecified
  OPTION_UNSPECIFIED = 0;
  // Icon and Text option selected
  OPTION_ICON_AND_TEXT = 1;
  // Icon only selected
  OPTION_ICON_ONLY = 2;
}

// The source from which Quick Setting was entered
// Next ID: 4
enum QuickSettingEntrySource {
  // Entry unspecified
  ENTRY_SOURCE_UNSPECIFIED = 0;
  // Entered from Live Entry UI
  ENTRY_SOURCE_LIVE_ENTRY = 1;
  // Entered from Notification Tray
  ENTRY_SOURCE_N10N_TRAY = 2;
  // Entered from Notification Full View
  ENTRY_SOURCE_N10N_FULL_VIEW = 3;
}

