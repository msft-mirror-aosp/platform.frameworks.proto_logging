syntax = "proto2";

package android.appfunctions;

option java_outer_classname = "AppFunctionProtoEnums";
option java_multiple_files = true;

/**
 * The enum class of AppFunction interaction type.
 *
 * It is provided by the AppFunction caller to specify the reason of the function call request.
 *
 * Next tag: 4
 */
enum InteractionType {
    UNSPECIFIED = 0;

    // Indicates an interaction type not covered by other predefined constants. Unlike UNSPECIFIED
    // this value means there is a specified custom value that is not covered by the enums.
    OTHER = 1;

    // Indicates that the app function execution was triggered as a direct result of a user query.
    USER_QUERY = 2;

    // Indicates that the app function execution was triggered by a user-scheduled task.
    USER_SCHEDULED = 3;
}

/**
 * The enum class of AppFunction function type.
 *
 * Next tag: 4
 */
enum FunctionType {
    FUNCTION_TYPE_UNSPECIFIED = 0;

    // Indicates that the function implementation is provided during the build
    // time.
    FUNCTION_TYPE_STATIC = 1;

    // Indicates that the function implementation is provided by the app at
    // runtime and is globally registered.
    FUNCTION_TYPE_DYNAMIC_GLOBAL = 2;

    // Indicates that the function implementation is provided by the app at
    // runtime and is tied to a specific activity. There can multiple
    // registrations of the same function identifier as long as they are tied to
    // different activities.
    FUNCTION_TYPE_DYNAMIC_ACTIVITY = 3;
}
