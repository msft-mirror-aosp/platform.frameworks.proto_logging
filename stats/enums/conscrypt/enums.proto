syntax = "proto2";

package android.os.statsd.conscrypt;

option java_package = "com.android.os.conscrypt";

enum LogListStatus {
    STATUS_UNKNOWN = 0;
    STATUS_SUCCESS = 1;           // The list was loaded successfully.
    STATUS_NOT_FOUND = 2;         // The list file was not found.
    STATUS_PARSING_FAILED = 3;    // The list file failed to parse.
    STATUS_EXPIRED = 4;           // The timestamp on the list is older than expected for the policy.
}

enum LogListCompatibilityVersion {
    COMPAT_VERSION_UNKNOWN = 0;
    COMPAT_VERSION_V1 = 1;
    COMPAT_VERSION_V2 = 2;
    COMPAT_VERSION_V3 = 3;
}

enum VerificationResult {
    RESULT_UNKNOWN = 0;
    RESULT_SUCCESS = 1;
    RESULT_GENERIC_FAILURE = 2;
    RESULT_FAILURE_NO_SCTS_FOUND = 3;
    RESULT_FAILURE_SCTS_NOT_COMPLIANT = 4;
    RESULT_FAIL_OPEN_NO_LOG_LIST_AVAILABLE = 5;
    RESULT_FAIL_OPEN_LOG_LIST_NOT_COMPLIANT = 6;
    RESULT_FAIL_OPEN_LOG_LIST_DATE_INVALID = 7;
    RESULT_FAIL_OPEN_LOG_LIST_DATE_EXPIRED = 8;
}

enum VerificationReason {
    REASON_UNKNOWN = 0;
    REASON_DEVICE_WIDE_ENABLED = 1;
    REASON_SDK_TARGET_DEFAULT_ENABLED = 2;
    REASON_NSCONFIG_APP_OPT_IN = 3;
    REASON_NSCONFIG_DOMAIN_OPT_IN = 4;
    REASON_DRY_RUN = 5;
}

enum BlocklistSource {
    BLOCKLIST_SOURCE_UNKNOWN = 0;
    BLOCKLIST_SOURCE_SHA1_TEST = 1;
    BLOCKLIST_SOURCE_SHA1_BUILT_IN = 2;
    BLOCKLIST_SOURCE_SHA1_FILE = 3;
    BLOCKLIST_SOURCE_SHA256_TEST = 4;
    BLOCKLIST_SOURCE_SHA256_BUILT_IN = 5;
    BLOCKLIST_SOURCE_SHA256_FILE = 6;
}

enum CertificateValidationFailureReason {
    CERTIFICATE_VALIDATION_FAILURE_REASON_UNKNOWN = 0;
    CERTIFICATE_VALIDATION_FAILURE_REASON_NO_TRUST_ANCHOR = 1;
}

enum EchResult {
    ECH_RESULT_UNKNOWN = 0;
    ECH_RESULT_SUCCESS = 1;
    ECH_RESULT_SUCCESS_GREASE = 2;
    ECH_RESULT_FAILURE = 3;
    ECH_RESULT_SKIPPED = 4;
}

enum EchUsageReason {
    ECH_REASON_UNKNOWN = 0;
    ECH_REASON_DEFAULT = 1;
    ECH_REASON_SDK_TARGET = 2;
    ECH_REASON_NSC_APP_OPT_IN = 3;
    ECH_REASON_NSC_DOMAIN_OPT_IN = 4;
}

enum EchSkipReason {
    ECH_SKIP_REASON_UNKNOWN = 0;
    ECH_SKIP_REASON_SDK_TARGET = 1;
    ECH_SKIP_REASON_NSC_APP_OPT_OUT = 2;
    ECH_SKIP_REASON_NSC_DOMAIN_OPT_OUT = 3;
    ECH_SKIP_REASON_NO_CONFIG = 4;
    ECH_SKIP_REASON_SERVER_SNI_MISMATCH = 5;
    ECH_SKIP_REASON_UNSUPPORTED_TLS_VERSION = 6;
}

enum EchFailureReason {
    ECH_FAILURE_REASON_UNKNOWN = 0;
    // Corresponding to SSL_R_ECH_REJECTED
    ECH_FAILURE_REASON_SERVER_REJECTION = 1;
    // Corresponding to SSL_R_INVALID_ECH_CONFIG_LIST
    ECH_FAILURE_REASON_INVALID_CONFIG = 2;
    // Corresponding to SSL_R_INCONSISTENT_ECH_NEGOTIATION
    ECH_FAILURE_REASON_INCONSISTENT_NEGOTIATION = 3;
    // If no retry configs are returned
    ECH_FAILURE_REASON_NO_RETRY_CONFIGS = 4;
}
