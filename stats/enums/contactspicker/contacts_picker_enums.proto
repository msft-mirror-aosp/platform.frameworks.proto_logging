syntax = "proto2";

package android.os.statsd.contactspicker;

option java_outer_classname = "ContactsPickerProtoEnums";
option java_multiple_files = true;

// The Intent action that the picker is launched with.
enum IntentActionType {
  INTENT_ACTION_TYPE_UNSPECIFIED = 0;
  // "android.intent.action.PICK" defined in android.content.Intent
  INTENT_ACTION_TYPE_ACTION_PICK = 1;
  // "android.provider.action.PICK_CONTACTS" defined in
  // android.provider.ContactsPickerSessionContract
  INTENT_ACTION_TYPE_ACTION_PICK_CONTACTS = 2;
}

// The mime type of the contact data being requested.
enum ContactMimeType {
  MIME_TYPE_UNSPECIFIED = 0;
  // ContactsContract.Contacts.CONTENT_TYPE
  MIME_TYPE_FULL_CONTACT = 1;
  // ContactsContract.CommonDataKinds.StructuredName.CONTENT_ITEM_TYPE
  MIME_TYPE_NAME = 2;
  // ContactsContract.CommonDataKinds.Phone.CONTENT_ITEM_TYPE
  MIME_TYPE_PHONE = 3;
  // ContactsContract.CommonDataKinds.Email.CONTENT_ITEM_TYPE
  MIME_TYPE_EMAIL = 4;
  // ContactsContract.CommonDataKinds.StructuredPostal.CONTENT_ITEM_TYPE
  MIME_TYPE_POSTAL_ADDRESS = 5;
  // ContactsContract.CommonDataKinds.Organization.CONTENT_ITEM_TYPE
  MIME_TYPE_ORGANISATION = 6;
  // ContactsContract.CommonDataKinds.Relation.CONTENT_ITEM_TYPE
  MIME_TYPE_RELATION = 7;
  // ContactsContract.CommonDataKinds.Event.CONTENT_ITEM_TYPE
  MIME_TYPE_EVENT = 8;
  // ContactsContract.CommonDataKinds.Photo.CONTENT_ITEM_TYPE
  MIME_TYPE_PHOTO = 9;
  // ContactsContract.CommonDataKinds.GroupMembership.CONTENT_ITEM_TYPE
  MIME_TYPE_GROUP_MEMBERSHIP = 10;
  // ContactsContract.CommonDataKinds.Website.CONTENT_ITEM_TYPE
  MIME_TYPE_WEBSITE = 11;
  // ContactsContract.CommonDataKinds.Nickname.CONTENT_ITEM_TYPE
  MIME_TYPE_NICKNAME = 12;
}

// The result of the picker session.
enum ContactsPickerSessionResult {
  SESSION_RESULT_UNSPECIFIED = 0;
  // The user successfully completed the session.
  SESSION_RESULT_SUCCESS = 1;
  // The user cancelled the session.
  SESSION_RESULT_CANCELLED_BY_USER = 2;
  // The session failed to complete.
  SESSION_RESULT_FAILED = 3;
  // The intent was not handled by the picker and was forwarded to other ACTION_PICK handlers.
  SESSION_RESULT_FORWARDED = 4;
}

// Errors for the contact picker session.
// TODO(b/441482576): add errors for more exception types when error handling is implemented.
enum ContactsPickerErrorType {
  ERROR_UNSPECIFIED = 0;
  // The received intent action is not supported by the picker.
  ERROR_UNSUPPORTED_ACTION = 1;
  // The requested mime type is not supported by the picker.
  ERROR_UNSUPPORTED_MIME_TYPE = 2;
  // The requested selection limit is not supported by the picker.
  ERROR_UNSUPPORTED_SELECTION_LIMIT = 3;
  // The initial contacts loading was cancelled.
  ERROR_CANCELLATION_EXCEPTION_LOADING_INITIAL_CONTACTS = 4;
}