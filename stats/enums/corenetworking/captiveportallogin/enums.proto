syntax = "proto2";

package android.os.statsd.corenetworking.captiveportallogin;
option java_multiple_files = true;

option java_package = "com.android.os.corenetworking.captiveportallogin";

enum CaptivePortalResult {
    CAPTIVE_PORTAL_RESULT_UNKNOWN = 0;
    // The captive portal is closed successfully.
    CAPTIVE_PORTAL_RESULT_SUCCESS = 1;
    // The captive portal is closed as unwanted.
    CAPTIVE_PORTAL_RESULT_UNWANTED = 2;
    // The captive portal is closed as wanted as is.
    CAPTIVE_PORTAL_RESULT_WANTED_AS_IS = 3;
}

enum CaptivePortalUsingWebViewReason {
    REASON_UNKNOWN = 0;
    // Due to the experiment flag is not enabled.
    REASON_FEATURE_NOT_ENABLED = 1;
    // Due to the device is still running on Android R.
    REASON_RUNNING_ANDROID_R = 2;
    // Due to the default browser doesn't support custom tabs APIs.
    REASON_NOT_SUPPORT_CCT = 3;
    // Due to the default browser doesn't support multi-network.
    REASON_NOT_SUPPORT_MULTI_NETWORK = 4;
    // Due to the private DNS is enabled on V and below.
    REASON_PRIVATE_DNS_ENABLED_V_AND_BELOW = 5;
    // Due to the user clicks the menu item "Use classic portal".
    REASON_USE_CLASSIC_PORTAL = 6 [deprecated = true];
    // Due to the user clicks the menu item "Use classic view",
    REASON_USE_CLASSIC_VIEW = 7;
}

enum CaptivePortalLoginAppEvent {
    CAPTIVE_PORTAL_LOGIN_APP_EVENT_UNKNOWN = 0;
    // The captive portal login app is started.
    CAPTIVE_PORTAL_LOGIN_APP_EVENT_STARTED = 1;
    // The captive portal login app is done.
    CAPTIVE_PORTAL_LOGIN_APP_EVENT_DONE = 2;
}
