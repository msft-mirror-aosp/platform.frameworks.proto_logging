syntax = "proto2";

package android.stats.crossdevicesync;

enum SyncEvent {
  EVENT_UNSPECIFIED = 0;
  EVENT_INBOUND_SYNC_UPDATES_LOCAL_STATE = 1;
  EVENT_INBOUND_SYNC_NOT_CHANGING_LOCAL_STATE = 2;
  EVENT_INBOUND_MESSAGE_RECEIVED = 3;
  EVENT_INBOUND_MESSAGE_DROPPED = 4;
  EVENT_MESSAGE_QUEUE_STARTED = 5;
  EVENT_MESSAGE_QUEUE_FINISHED = 6;
  EVENT_MESSAGE_QUEUE_FAILED = 7;
  EVENT_MESSAGE_SEND_STARTED = 8;
  EVENT_MESSAGE_SEND_FINISHED = 9;
  EVENT_MESSAGE_SEND_FAILED = 10;
}

enum SyncFeature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_METADATA = 1;
  FEATURE_AIRPLANE_MODE_SYNC = 2;
  FEATURE_CONTEXTUAL_MODE_SYNC = 3;
}
