syntax = "proto2";
package android.debug;

option java_outer_classname = "AdbProtoEnums";
option java_multiple_files = true;

/**
 * adb connection state used to track adb connection changes in AdbDebuggingManager.java.
 */
// Next ID: 24
enum AdbConnectionStateEnum {
    UNKNOWN = 0;

    /**
     * The adb connection is waiting for approval from the user.
     */
    AWAITING_USER_APPROVAL = 1;

    /**
     * The user allowed the adb connection from the system.
     */
    USER_ALLOWED = 2;

    /**
     * The user always allowed the adb connection from the system.
     */
    USER_ALWAYS_ALLOWED = 23;

    /**
     * The user denied the adb connection from the system.
     */
    USER_DENIED = 3;

    /**
     * The adb connection was automatically allowed without user interaction due to the system
     * being previously allowed by the user with the 'always allow' option selected, and the adb
     * grant has not yet expired.
     */
    AUTOMATICALLY_ALLOWED = 4;

    /**
     * An empty or invalid base64 encoded key was provided to the framework; the connection was
     * automatically denied.
     */
    DENIED_INVALID_KEY = 5;

    /**
     * vold decrypt has not yet occurred; the connection was automatically denied.
     */
    DENIED_VOLD_DECRYPT = 6;

    /**
     * The adb session has been disconnected.
     */
    DISCONNECTED = 7;

    /**
     * Wireless debugging is turned on.
     */
    ADB_WIFI_ENABLED = 8;

    /**
     * Wireless debugging is turned on due to auto-enable.
     */
    ADB_WIFI_AUTO_ENABLED = 9;

    /**
     * Wireless debugging is turned off.
     */
    ADB_WIFI_DISABLED = 10;

    /**
     * Wireless debugging is turned off due to connecting to an untrusted network.
     */
    ADB_WIFI_AUTO_DISABLED = 11;

    /**
     * User allows wireless debugging.
     */
    ADB_WIFI_ALLOW_NETWORK = 12;

    /**
     * User allows wireless debugging with always allow option.
     */
    ADB_WIFI_ALWAYS_ALLOW_NETWORK = 13;

    /**
     * User denies wireless debugging.
     */
    ADB_WIFI_DENY_NETWORK = 14;

    /**
     * User unpair a paired device.
     */
    ADB_WIFI_UNPAIR_DEVICE = 15;

    /**
     * Device has connected through adb wifi.
     */
    ADB_WIFI_DEVICE_CONNECTED = 16;

    /**
     * Device has disconnected from adb wifi.
     */
    ADB_WIFI_DEVICE_DISCONNECTED = 17;

    /**
     * Device is pairing using QR code.
     */
    ADB_WIFI_QR_PAIRING_STARTED = 18;

    /**
     * Device is pairing using pairing code.
     */
    ADB_WIFI_PAIRING_CODE_STARTED = 19;

    /**
     * Device successfully paired.
     */
    ADB_WIFI_PAIRING_SUCCEEDED = 20;

    /**
     * Device failed to pair.
     */
    ADB_WIFI_PAIRING_FAILED = 21;

    /**
     * Pairing is cancelled.
     */
    ADB_WIFI_PAIRING_CANCELLED = 22;
}
