syntax = "proto2";

package android.os.statsd.microxr;

option java_outer_classname = "MicroXrEnums";
option java_multiple_files = true;


/**
 * Current status for an OTA event.
 *
 * Aligns with {@code com/android/microxr/systemupdateservice/UpdateStatusCode.java}.
 */
enum UpdateStatus {
    UPDATE_STATUS_UNSPECIFIED = 0;
    UPDATE_STATUS_NO_UPDATE = 1;
    UPDATE_STATUS_WAITING_DOWNLOAD = 2;
    UPDATE_STATUS_PRE_DOWNLOAD_VALIDATING = 3;
    UPDATE_STATUS_PRE_DOWNLOAD_VALIDATE_FAILED = 4;
    UPDATE_STATUS_DOWNLOADING = 5;
    UPDATE_STATUS_DOWNLOAD_FAILED = 6;
    UPDATE_STATUS_PROCESSING = 7;
    UPDATE_STATUS_WAITING_INSTALL = 8;
    UPDATE_STATUS_INSTALLING = 9;
    UPDATE_STATUS_INSTALL_FAILED = 10;
    UPDATE_STATUS_VERIFYING = 11;
    UPDATE_STATUS_WAITING_REBOOT = 12;
    UPDATE_STATUS_INSTALLED = 13;
}

/**
 * Current reason for an OTA event's status.

 * Aligns with {@code com/android/microxr/systemupdateservice/UpdateStatusReason.java}.
 */
enum UpdateReason {
    UPDATE_REASON_UNSPECIFIED = 0;
    UPDATE_REASON_DEVICE_NOT_IDLE = 1;
    UPDATE_REASON_DEVICE_DEVICE_OVERHEAT = 2;
    UPDATE_REASON_DEVICE_DEVICE_ROAMING = 3;
    UPDATE_REASON_DEVICE_INSUFFICIENT_SPACE = 4;
    UPDATE_REASON_DEVICE_LOW_BATTERY = 5;
    UPDATE_REASON_DEVICE_NEED_WIFI = 6;
    UPDATE_REASON_DEVICE_NETWORK_ERROR = 7;
    UPDATE_REASON_DEVICE_NOT_APPROVED = 8;
    UPDATE_REASON_DEVICE_NOT_ON_CHARGER = 9;
    UPDATE_REASON_DEVICE_PAUSED = 10;
    UPDATE_REASON_DEVICE_SCHEDULED_UPDATE = 11;
}

/**
 * Companion device type.
 */
enum CompanionDevice {
    COMPANION_DEVICE_UNSPECIFIED = 0;
    COMPANION_DEVICE_ANDROID_PHONE = 1;
    COMPANION_DEVICE_IOS_PHONE = 2;
}

/**
* The type of MicroXr Photo Capture Mode
*/
enum CaptureMode {
    CAPTURE_MODE_UNKNOWN = 0;
    // Standard capture flow (non-HDR).
    CAPTURE_MODE_NON_HDR = 1;
    // HDR capture flow (also referred to as Darklight).
    CAPTURE_MODE_HDR= 2;
  }