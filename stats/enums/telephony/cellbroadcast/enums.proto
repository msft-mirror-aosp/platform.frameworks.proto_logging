syntax = "proto2";
package android.telephony.cellbroadcast;

option java_outer_classname = "CellbroadcastProtoEnums";
option java_multiple_files = true;


enum TranslationErrorType {
    // Translation unknown error
    TRANSLATION_ERROR_UNKNOWN = 0;
    // Translation success
    TRANSLATION_ERROR_NONE = 1;

    // Errors occurring within CellBroadcastTranslateManager ---
    // Network error, timeout, or other general exceptions
    TRANSLATION_ERROR_NETWORK_EXCEPTION = 2;
    // Received HTTP error response from API server (e.g., 4xx, 5xx)
    TRANSLATION_ERROR_HTTP_ERROR = 3;
    // Failed to parse API server response JSON
    TRANSLATION_ERROR_PARSING_FAILED = 4;
    // Failed to retrieve app signing info: Package not found
    TRANSLATION_ERROR_PACKAGE_NOT_FOUND = 5;
    // Failed to retrieve app signing info: SigningInfo is null
    TRANSLATION_ERROR_SIGNING_INFO_NULL = 6;
    // Failed to generate SHA-1 hash: Encryption algorithm not found
    TRANSLATION_ERROR_NO_SUCH_ALGORITHM = 7;

    // Possible situations during translation processing within CellBroadcastAlertDialog ---
    // Previous translation task was canceled by a new translation request
    TRANSLATION_ERROR_CANCELLED = 8;
    // Translation result arrived, but not used because the message to be displayed has changed
    TRANSLATION_ERROR_STALE_RESULT = 9;
    // Translation result arrived, but the activity is finishing or has already been destroyed
    TRANSLATION_ERROR_ACTIVITY_DESTROYED = 10;

    // Translation button is shown but translation is not requested
    TRANSLATION_ERROR_NOT_APPLICABLE = 11;
    // Translation is requested but language download is necessary
    TRANSLATION_ERROR_LANGUAGE_MISSING = 12;
    // Translation is failed due to exception
    TRANSLATION_ERROR_EXCEPTION = 13;
}


enum MapErrorType {
    // Map unknown error
    MAP_ERROR_UNKNOWN = 0;
    // Map success
    MAP_ERROR_NONE = 1;

    // Input data errors
    // Smscbmessage object is null
    MAP_ERROR_NO_MESSAGE = 2;
    // No geometry information in the message
    MAP_ERROR_NO_GEOMETRY_DATA = 3;
    // Geometry information exists but is invalid data
    MAP_ERROR_INVALID_GEOMETRY_DATA = 4;
    // URI encoding failed
    MAP_ERROR_URI_ENCODING_FAILED = 5;

    // Core activity lookup errors
    // No system activity found to handle the intent
    MAP_ERROR_CORE_ACTIVITY_NOT_FOUND = 6;
    // Found activity lacks required permission
    MAP_ERROR_CORE_ACTIVITY_PERMISSION_DENIED = 7;
    // Multiple system activities found
    MAP_ERROR_MULTIPLE_CORE_ACTIVITIES_FOUND = 8;
    // Exception occurred during permission check
    MAP_ERROR_PERMISSION_CHECK_EXCEPTION = 9;

    // Core activity execution error
    // Failed to start the final selected activity
    MAP_ERROR_CORE_ACTIVITY_START_FAILED = 10;
}

// Type of geographic information passed to the map activity
enum GeoDataType {
    // Unknown geometry type
    GEO_DATA_TYPE_UNKNOWN = 0;
    // Polygon geometry type
    GEO_DATA_TYPE_POLYGON = 1;
    // Circle geometry type
    GEO_DATA_TYPE_CIRCLE = 2;
    // Multiple geometry types (e.g., polygon + circle)
    GEO_DATA_TYPE_MULTIPLE = 3;
}
