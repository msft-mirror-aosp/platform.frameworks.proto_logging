syntax = "proto2";

package android.os.statsd.users;

// The type of the sign-in duration being reported.
enum SignInDurationType {
    SIGN_IN_DURATION_TYPE_UNKNOWN = 0;
    // Lockscreen unlocking to launcher shown. Most representative atom of
    // user-visible sign-in time. Available only for the system launcher app.
    LOCKSCREEN_UNLOCKING_TO_LAUNCHER_SHOWN = 1;
}
