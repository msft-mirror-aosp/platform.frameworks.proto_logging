syntax = "proto2";

package com.google.android.clockwork.physicalux;

// Gesture Actions
enum GestureAction {
  ACTION_UNSPECIFIED = 0;
  ACTION_PRIMARY = 1;
  ACTION_DISMISS = 2;
}

// Raw Gestures
enum Gesture {
  GESTURE_UNSPECIFIED = 0;
  GESTURE_DOUBLE_PINCH = 1;
  GESTURE_WRIST_TURN = 2;
}

// State of gesture detection
enum GestureDetectionState {
  STATE_UNSPECIFIED = 0;
  STATE_ACTIVE = 1;
  STATE_INACTIVE = 2;
}