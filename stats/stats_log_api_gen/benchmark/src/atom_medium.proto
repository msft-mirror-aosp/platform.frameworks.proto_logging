    optional float float_field_3 = 33;
    optional float float_field_4 = 34;
    optional float float_field_5 = 35;
    optional EnumMedium enum_field_1 = 36;
    optional EnumMedium enum_field_2 = 37;
    optional EnumMedium enum_field_3 = 38;
    optional EnumMedium enum_field_4 = 39;
    optional EnumMedium enum_field_5 = 40;
}
