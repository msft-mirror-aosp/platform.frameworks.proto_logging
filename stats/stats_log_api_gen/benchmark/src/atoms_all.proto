syntax = "proto2";

package android.benchmark;

import "frameworks/proto_logging/stats/stats_log_api_gen/benchmark/src/atom_large.proto";
import "frameworks/proto_logging/stats/stats_log_api_gen/benchmark/src/atom_medium.proto";
import "frameworks/proto_logging/stats/stats_log_api_gen/benchmark/src/atom_small.proto";

message Atom {
    oneof pushed {
        AtomLarge atom_large = 1;
        AtomMedium atom_medium = 2;
        AtomSmall atom_small = 3;
    }
}
